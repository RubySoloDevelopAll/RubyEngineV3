<style>
:root{
  --bg:#04121a;--card:rgba(255,255,255,0.04);--card-solid:#0a2030;
  --fg:#e0f4ff;--mut:#5d8ba8;
  --acc:#22d3ee;--acc2:#38bdf8;
  --line:rgba(34,211,238,0.16);
  --grad:linear-gradient(135deg,#22d3ee,#38bdf8);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(34,211,238,0.20), transparent),
    radial-gradient(ellipse 60% 40% at 100% 30%, rgba(56,189,248,0.12), transparent);
  color:var(--fg);
  min-height:100dvh;
  padding:16px;
  padding-top:calc(16px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}

/* TOP */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{
  width:42px;height:42px;border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);backdrop-filter:blur(10px);
  display:grid;place-items:center;color:var(--fg);
  text-decoration:none;font-size:20px;flex-shrink:0;
  transition:all .2s;
}
.back:active{transform:scale(.92);background:rgba(34,211,238,0.12)}
.title-wrap{display:flex;flex-direction:column;gap:2px}
.title{
  font-size:17px;font-weight:800;letter-spacing:-0.01em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.subtitle{font-size:11px;color:var(--mut);letter-spacing:.06em;font-weight:600;text-transform:uppercase}

/* CARD */
.card{
  background:var(--card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:14px;
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(400px circle at 50% 0%, rgba(34,211,238,0.10), transparent 60%);
  pointer-events:none;
}

/* FORM */
.f{margin-bottom:12px;position:relative;z-index:1}
.f:last-child{margin-bottom:0}
.f label{
  display:block;font-size:11px;color:var(--mut);
  margin-bottom:6px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.f input,.f textarea{
  width:100%;padding:13px 14px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:var(--fg);font-size:14.5px;
  font-family:inherit;font-weight:600;
  transition:all .2s;resize:vertical;
}
.f textarea{min-height:56px;line-height:1.5}
.f input:focus,.f textarea:focus{
  outline:none;border-color:rgba(34,211,238,0.5);
  background:rgba(34,211,238,0.06);
  box-shadow:0 0 0 4px rgba(34,211,238,0.10);
}
.f input::placeholder,.f textarea::placeholder{color:var(--mut);font-weight:400}

/* CHIPS */
.chips-row{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;
  position:relative;z-index:1;
}
.chips-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:9px 15px;
  border-radius:999px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:var(--mut);
  font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:all .2s;
  white-space:nowrap;
}
.chip:active{transform:scale(.95)}
.chip.active{
  background:rgba(34,211,238,0.15);
  border-color:rgba(34,211,238,0.5);
  color:var(--acc);
  box-shadow:0 0 20px rgba(34,211,238,0.25);
}

/* BUTTON */
.go{
  width:100%;padding:16px;border-radius:14px;
  background:var(--grad);
  color:#04121a;font-size:15px;font-weight:800;
  letter-spacing:.03em;
  border:none;font-family:inherit;cursor:pointer;
  box-shadow:0 10px 30px -8px rgba(34,211,238,0.5),
             inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform .15s, box-shadow .2s;
  margin-bottom:16px;position:relative;overflow:hidden;
}
.go::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.3), transparent 55%);
  pointer-events:none;
}
.go:active{
  transform:scale(.97);
  box-shadow:0 4px 16px -4px rgba(34,211,238,0.6);
}

/* RESULT */
.result-wrap{display:none;position:relative;animation:up .35s cubic-bezier(.4,0,.2,1) both}
.result-wrap.show{display:block}
@keyframes up{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.res{
  padding:18px;border-radius:16px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--line);
  font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  color:var(--fg);
  max-height:60vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
.res::-webkit-scrollbar{width:4px}
.res::-webkit-scrollbar-thumb{background:rgba(34,211,238,0.3);border-radius:2px}

/* FLOATING COPY */
.cp-fab{
  position:absolute;top:10px;right:10px;
  width:36px;height:36px;border-radius:11px;
  background:rgba(34,211,238,0.15);
  border:1px solid rgba(34,211,238,0.35);
  color:var(--acc);
  display:grid;place-items:center;
  cursor:pointer;font-family:inherit;
  font-size:16px;
  transition:all .2s;
  backdrop-filter:blur(8px);
}
.cp-fab:active{transform:scale(.9)}
.cp-fab.ok{
  background:rgba(61,220,132,0.18);
  border-color:rgba(61,220,132,0.5);
  color:#3ddc84;
}

/* EMPTY */
.empty{
  text-align:center;padding:40px 20px;
  color:var(--mut);font-size:13px;
}
.empty-icon{font-size:38px;margin-bottom:10px;opacity:.4}

/* ORB */
.orb{
  position:fixed;border-radius:50%;
  filter:blur(80px);pointer-events:none;
  opacity:.35;z-index:-1;
}
.orb1{width:200px;height:200px;background:#22d3ee;top:-60px;left:-60px}
.orb2{width:160px;height:160px;background:#38bdf8;bottom:-40px;right:-60px}

<button class="go" id="gen">✨ Generate Deskripsi</button>

<div class="empty" id="empty">

</div>

<div class="result-wrap" id="resWrap">
  <div class="res" id="out"></div>
  <button class="cp-fab" id="cp" title="Copy">📋</button>
</div>

// ============== UTILS ==============
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function cap(s){return s ? s.charAt(0).toUpperCase()+s.slice(1) : s}
function fill(tpl, nama, kat){
  return tpl.replace(/\{nama\}/g, nama).replace(/\{kat\}/g, kat);
}

// ============== GENERATOR ==============
function generate(nama, kat, keunggulan, tone, len){
  var T = TONES[tone] || TONES.profesional;
  var emoji = rnd(T.emoji);
  var bullet = rnd(T.bullets);
  var open = fill(rnd(T.opens), nama, kat);
  var mid = fill(rnd(T.mids), nama, kat);
  var close = fill(rnd(T.closes), nama, kat);
  var cta = fill(rnd(T.ctas), nama, kat);
  var parts = [];

  // Bullet list dari keunggulan
  var bl = keunggulan.map(function(x){ return bullet + ' ' + cap(x); }).join('\n');

  if(len === 'pendek'){
    parts.push(emoji + ' ' + open);
    if(keunggulan.length) parts.push(keunggulan.slice(0,2).map(function(x){ return bullet + ' ' + cap(x); }).join('\n'));
    parts.push(cta);
  }
  else if(len === 'sedang'){
    parts.push(emoji + ' ' + open);
    if(keunggulan.length) parts.push('Keunggulan:\n' + bl);
    parts.push(mid);
    parts.push(close);
    parts.push(cta);
  }
  else { // panjang
    parts.push(emoji + '  ' + nama.toUpperCase() + '  ' + emoji);
    parts.push(open);
    if(keunggulan.length) parts.push('Keunggulan utama:\n' + bl);
    parts.push(mid);
    parts.push(fill(rnd(T.mids), nama, kat));
    parts.push(close);
    parts.push(cta);
  }

  return parts.filter(Boolean).join('\n\n');
}

// ============== UI LOGIC ==============
var inputN = document.getElementById('n');
var inputK = document.getElementById('k');
var inputKL = document.getElementById('kl');
var toneRow = document.getElementById('toneRow');
var lenRow = document.getElementById('lenRow');
var btnGen = document.getElementById('gen');
var out = document.getElementById('out');
var resWrap = document.getElementById('resWrap');
var empty = document.getElementById('empty');
var btnCp = document.getElementById('cp');

var tone = 'profesional';
var len = 'sedang';

toneRow.addEventListener('click', function(e){
  var btn = e.target.closest('.chip');
  if(!btn) return;
  toneRow.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  tone = btn.getAttribute('data-tone');
  if(window.SFX && SFX.tap) SFX.tap();
});

lenRow.addEventListener('click', function(e){
  var btn = e.target.closest('.chip');
  if(!btn) return;
  lenRow.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('active'); });
  btn.classList.add('active');
  len = btn.getAttribute('data-len');
  if(window.SFX && SFX.tap) SFX.tap();
});

btnGen.addEventListener('click', function(){
  var nama = inputN.value.trim();
  var kat = inputK.value.trim();

  if(!nama){
    inputN.focus();
    if(window.SFX && SFX.err) SFX.err();
    inputN.style.borderColor = '#f472b6';
    setTimeout(function(){ inputN.style.borderColor = ''; }, 600);
    return;
  }
  if(!kat){
    inputK.focus();
    if(window.SFX && SFX.err) SFX.err();
    inputK.style.borderColor = '#f472b6';
    setTimeout(function(){ inputK.style.borderColor = ''; }, 600);
    return;
  }

  var keunggulan = inputKL.value.split(',').map(function(s){ return s.trim(); }).filter(Boolean);

  var result = generate(nama, kat, keunggulan, tone, len);
  out.textContent = result;

  empty.style.display = 'none';
  resWrap.classList.remove('show');
  void resWrap.offsetWidth; // trigger reflow untuk restart animasi
  resWrap.classList.add('show');

  if(window.SFX && SFX.win) SFX.win();
  else if(window.SFX && SFX.ok) SFX.ok();
});

// Copy
btnCp.addEventListener('click', function(){
  var txt = out.textContent;
  var done = function(){
    btnCp.textContent = '✓';
    btnCp.classList.add('ok');
    if(window.SFX && SFX.pickup) SFX.pickup();
    else if(window.SFX && SFX.tap) SFX.tap();
    setTimeout(function(){
      btnCp.textContent = '📋';
      btnCp.classList.remove('ok');
    }, 1300);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(done);
  } else {
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
    done();
  }
});

// Enter di input nama = fokus ke kategori
inputN.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); inputK.focus(); }
});
inputK.addEventListener('keydown', function(e){
  if(e.key === 'Enter'){ e.preventDefault(); btnGen.click(); }
});

setTimeout(function(){ inputN.focus(); }, 300);

})();
