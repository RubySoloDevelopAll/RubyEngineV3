<style>
:root{
  --bg:#0a0518;--card:rgba(255,255,255,0.04);--card-solid:#170e2e;
  --fg:#f5f0ff;--mut:#8b7bb8;
  --acc:#a855f7;--acc2:#ec4899;--acc3:#22d3ee;
  --line:rgba(168,85,247,0.16);
  --grad:linear-gradient(135deg,#a855f7,#ec4899);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168,85,247,0.22), transparent),
    radial-gradient(ellipse 60% 40% at 90% 20%, rgba(236,72,153,0.14), transparent),
    radial-gradient(ellipse 70% 50% at 10% 80%, rgba(34,211,238,0.08), transparent);
  color:var(--fg);
  min-height:100dvh;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}

/* TOP */
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{
  width:42px;height:42px;border-radius:14px;
  border:1px solid var(--line);
  background:var(--card);backdrop-filter:blur(10px);
  display:grid;place-items:center;color:var(--fg);
  text-decoration:none;font-size:20px;flex-shrink:0;
  transition:all .2s;
}
.back:active{transform:scale(.92);background:rgba(168,85,247,0.15)}
.title-wrap{display:flex;flex-direction:column;gap:2px}
.title{
  font-size:17px;font-weight:800;letter-spacing:-0.01em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.subtitle{font-size:11px;color:var(--mut);letter-spacing:.06em;font-weight:600;text-transform:uppercase}

/* TABS */
.tabs{
  display:flex;gap:6px;overflow-x:auto;
  scrollbar-width:none;-ms-overflow-style:none;
  margin-bottom:14px;padding-bottom:4px;
}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  flex-shrink:0;padding:9px 14px;border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:var(--mut);
  font-family:inherit;font-size:12.5px;font-weight:700;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.tabs button:active{transform:scale(.96)}
.tabs button.on{
  background:var(--grad);
  color:#0a0518;border-color:transparent;
  font-weight:800;
  box-shadow:0 6px 20px -4px rgba(168,85,247,0.5);
}

/* PANEL */
.panel{display:none}
.panel.on{display:block;animation:fadeUp .3s cubic-bezier(.4,0,.2,1)}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* CARD */
.card{
  background:var(--card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:12px;
  position:relative;overflow:hidden;
}
.card::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(400px circle at 50% 0%, rgba(168,85,247,0.08), transparent 60%);
  pointer-events:none;
}

/* FORM */
.f{margin-bottom:12px;position:relative;z-index:1}
.f:last-child{margin-bottom:0}
.f label{
  display:block;font-size:11px;color:var(--mut);
  margin-bottom:6px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
}
.f input,.f select,.f textarea{
  width:100%;padding:13px 14px;
  border-radius:12px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:var(--fg);font-size:14px;
  font-family:inherit;font-weight:600;
  transition:all .2s;
}
.f select{
  appearance:none;cursor:pointer;
  padding-right:36px;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b7bb8' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat:no-repeat;
  background-position:right 14px center;
}
.f select option{background:#170e2e;color:var(--fg)}
.f input:focus,.f select:focus,.f textarea:focus{
  outline:none;border-color:rgba(168,85,247,0.5);
  background:rgba(168,85,247,0.06);
  box-shadow:0 0 0 4px rgba(168,85,247,0.10);
}
.f input::placeholder,.f textarea::placeholder{color:var(--mut);font-weight:400}
.f textarea{resize:vertical;min-height:56px;line-height:1.5}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.row{grid-template-columns:1fr}}

/* CHIPS */
.chips{
  display:flex;gap:8px;overflow-x:auto;
  padding-bottom:4px;
  scrollbar-width:none;-ms-overflow-style:none;
  position:relative;z-index:1;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0;padding:8px 14px;
  border-radius:999px;
  background:rgba(255,255,255,0.03);
  border:1px solid var(--line);
  color:var(--mut);
  font-family:inherit;font-size:12px;font-weight:700;
  cursor:pointer;transition:all .2s;white-space:nowrap;
}
.chip:active{transform:scale(.95)}
.chip.active{
  background:rgba(168,85,247,0.15);
  border-color:rgba(168,85,247,0.5);
  color:var(--acc);
  box-shadow:0 0 18px rgba(168,85,247,0.25);
}

/* BUTTON */
.go{
  width:100%;padding:15px;border-radius:14px;
  background:var(--grad);
  color:#0a0518;font-size:14.5px;font-weight:800;
  letter-spacing:.03em;
  border:none;font-family:inherit;cursor:pointer;
  box-shadow:0 10px 30px -8px rgba(168,85,247,0.55),
             inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform .15s, box-shadow .2s;
  margin-bottom:12px;
  position:relative;overflow:hidden;
}
.go::before{
  content:"";position:absolute;inset:0;
  background:linear-gradient(135deg, rgba(255,255,255,0.28), transparent 55%);
  pointer-events:none;
}
.go:active{
  transform:scale(.97);
  box-shadow:0 4px 16px -4px rgba(168,85,247,0.6);
}

/* RESULT */
.res{
  padding:16px;border-radius:14px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--line);
  font-size:13.5px;line-height:1.7;
  white-space:pre-wrap;word-break:break-word;
  color:var(--fg);min-height:60px;
  max-height:60vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  position:relative;
}
.res::-webkit-scrollbar{width:4px}
.res::-webkit-scrollbar-thumb{background:rgba(168,85,247,0.3);border-radius:2px}
.res:empty::before{content:'Hasil akan muncul di sini…';color:var(--mut)}

/* LIST */
.list{display:flex;flex-direction:column;gap:8px}
.it{
  padding:12px 14px;
  border-radius:12px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;gap:10px;
  animation:up .3s cubic-bezier(.4,0,.2,1) both;
  transition:all .2s;
}
.it:hover{border-color:rgba(168,85,247,0.35);background:rgba(168,85,247,0.06)}
@keyframes up{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
.it>span{
  flex:1;font-size:13px;font-weight:600;
  line-height:1.45;word-break:break-word;
}
.it>span small{
  display:block;margin-top:3px;
  color:var(--mut);font-size:11.5px;font-weight:500;
}
.it button{
  flex-shrink:0;
  padding:7px 12px;border-radius:9px;
  background:rgba(168,85,247,0.12);
  border:1px solid rgba(168,85,247,0.3);
  color:var(--acc);
  font-family:inherit;font-size:11px;font-weight:800;
  letter-spacing:.04em;cursor:pointer;
  transition:all .2s;min-width:56px;
}
.it button:active{transform:scale(.94)}
.it button.ok{
  background:rgba(61,220,132,0.15);
  color:#3ddc84;
  border-color:rgba(61,220,132,0.4);
}
.it button.del{
  background:rgba(244,114,182,0.12);
  color:#f472b6;
  border-color:rgba(244,114,182,0.3);
  min-width:auto;padding:7px 10px;
}

/* COPY FAB */
.cp-fab{
  position:absolute;top:10px;right:10px;
  width:34px;height:34px;border-radius:10px;
  background:rgba(168,85,247,0.15);
  border:1px solid rgba(168,85,247,0.35);
  color:var(--acc);
  display:grid;place-items:center;
  cursor:pointer;font-family:inherit;font-size:14px;
  transition:all .2s;
  backdrop-filter:blur(8px);
  z-index:2;
}
.cp-fab:active{transform:scale(.9)}
.cp-fab.ok{
  background:rgba(61,220,132,0.18);
  border-color:rgba(61,220,132,0.5);
  color:#3ddc84;
}

/* STAT BOX */
.stat-grid{
  display:grid;grid-template-columns:1fr 1fr;
  gap:8px;margin-bottom:12px;
}
.stat-box{
  padding:14px;border-radius:12px;
  background:rgba(255,255,255,0.035);
  border:1px solid var(--line);
}
.stat-box .lbl{
  font-size:10.5px;color:var(--mut);
  font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;margin-bottom:4px;
}
.stat-box .val{
  font-size:20px;font-weight:800;
  color:var(--fg);
  font-variant-numeric:tabular-nums;
}
.stat-box .val.acc{color:var(--acc)}
.stat-box .val.pink{color:var(--acc2)}
.stat-box .val.cyan{color:var(--acc3)}

.progress{
  height:8px;border-radius:4px;
  background:rgba(255,255,255,0.06);
  overflow:hidden;margin:8px 0 14px;
}
.progress-bar{
  height:100%;border-radius:4px;
  background:var(--grad);
  transition:width .5s cubic-bezier(.4,0,.2,1);
}

/* ORB */
.orb{
  position:fixed;border-radius:50%;
  filter:blur(80px);pointer-events:none;
  opacity:.4;z-index:-1;
}
.orb1{width:220px;height:220px;background:#a855f7;top:-70px;left:-70px}
.orb2{width:170px;height:170px;background:#ec4899;top:45%;right:-80px}
.orb3{width:150px;height:150px;background:#22d3ee;bottom:-50px;left:15%}
</style>

<script>
(function(){
'use strict';

// ============== UTILS ==============
function R(a){ return a[Math.floor(Math.random()*a.length)] }
function RI(min, max){ return Math.floor(Math.random()*(max-min+1))+min }
function esc(s){ return String(s||'').replace(/[<>]/g,'') }
function unique(arr){
  var seen={}, out=[];
  arr.forEach(function(x){ if(!seen[x]){ seen[x]=1; out.push(x); } });
  return out;
}
function copyText(txt, btn, orig){
  var done = function(){
    btn.textContent = '✓';
    btn.classList.add('ok');
    if(window.SFX && SFX.pickup) SFX.pickup();
    setTimeout(function(){
      btn.textContent = orig;
      btn.classList.remove('ok');
    }, 1300);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(done);
  } else {
    try{
      var ta = document.createElement('textarea');
      ta.value = txt;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }catch(e){}
    done();
  }
}

// ============== TABS ==============
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('#tabs button').forEach(function(x){ x.classList.remove('on') });
  b.classList.add('on');
  document.querySelectorAll('.panel').forEach(function(p){
    p.classList.toggle('on', p.dataset.p === b.dataset.t);
  });
  if(window.SFX && SFX.tap) SFX.tap();
});

// Chip helper (dipakai semua tab)
function bindChips(id){
  var box = document.getElementById(id);
  if(!box) return;
  box.addEventListener('click', function(e){
    var c = e.target.closest('.chip'); if(!c) return;
    box.querySelectorAll('.chip').forEach(function(x){ x.classList.remove('active') });
    c.classList.add('active');
    if(window.SFX && SFX.tap) SFX.tap();
  });
}

var PLAN_KEY = 'creator_studio_planner';
var planner = [];
try{ planner = JSON.parse(localStorage.getItem(PLAN_KEY) || '[]'); }catch(e){ planner = []; }

function savePlanner(){
  try{ localStorage.setItem(PLAN_KEY, JSON.stringify(planner)); }catch(e){}
}

function renderPlanner(){
  var box = document.getElementById('pOut');
  box.innerHTML = '';
  if(!planner.length){
    box.innerHTML = '<div class="it" style="color:#8b7bb8;justify-content:center;font-size:12.5px">📭 Belum ada konten. Tambahkan di atas.</div>';
    return;
  }
  planner.forEach(function(p, i){
    var el = document.createElement('div');
    el.className = 'it';
    el.style.animationDelay = (i * 30) + 'ms';
    el.innerHTML = '<span></span><button class="del">✕</button>';
    var span = el.querySelector('span');
    span.innerHTML = '<b>' + p.t + '</b><small>' + (p.d || '-') + ' • ' + p.s + '</small>';
    el.querySelector('button').addEventListener('click', function(){
      planner.splice(i, 1);
      savePlanner();
      renderPlanner();
      if(window.SFX && SFX.tap) SFX.tap();
    });
    box.appendChild(el);
  });
}

document.getElementById('pGo').addEventListener('click', function(){

  var s = document.getElementById('pStat').value;
  planner.unshift({t: t, d: d, s: s});

  savePlanner();
  renderPlanner();
  if(window.SFX && SFX.ok) SFX.ok();
});

document.getElementById('sGo').addEventListener('click', function(){
  var v = parseInt(document.getElementById('sVid').value) || 0;
  var t = Math.max(1, parseInt(document.getElementById('sTgt').value) || 1);
  var s = parseInt(document.getElementById('sStreak').value) || 0;
  var views = parseInt(document.getElementById('sViews').value) || 0;

  var pct = Math.min(100, Math.round(v / t * 100));
  var remain = Math.max(0, t - v);
  var avg = v > 0 ? Math.round(views / v) : 0;

  var level, levelEmoji;
  if(pct >= 100){ level = 'MASTER'; levelEmoji = '👑'; }
  else if(pct >= 70){ level = 'PRO'; levelEmoji = '🔥'; }
  else if(pct >= 40){ level = 'RISING'; levelEmoji = '⭐'; }
  else if(pct >= 15){ level = 'BEGINNER'; levelEmoji = '🌱'; }
  else { level = 'NEWBIE'; levelEmoji = '✨'; }

  var out = '<div class="stat-grid">';
  out += '<div class="stat-box"><div class="lbl">Upload</div><div class="val acc">' + v + '</div></div>';
  out += '<div class="stat-box"><div class="lbl">Target</div><div class="val">' + t + '</div></div>';
  out += '<div class="stat-box"><div class="lbl">Progress</div><div class="val pink">' + pct + '%</div></div>';
  out += '<div class="stat-box"><div class="lbl">Streak</div><div class="val cyan">' + s + '🔥</div></div>';
  out += '<div class="stat-box"><div class="lbl">Total Views</div><div class="val">' + views.toLocaleString('id-ID') + '</div></div>';
  out += '<div class="stat-box"><div class="lbl">Avg / Video</div><div class="val">' + avg.toLocaleString('id-ID') + '</div></div>';
  out += '</div>';

  out += '<div class="progress"><div class="progress-bar" style="width:' + pct + '%"></div></div>';

  out += '<div class="res" style="margin-top:0">';
  out += levelEmoji + ' Level: <b>' + level + '</b>\n\n';
  if(remain > 0){
    out += '💡 ' + remain + ' video lagi untuk capai target.\n';
    out += '📅 Estimasi: ' + Math.ceil(remain / 3) + ' minggu kalau upload 3×/minggu.\n';
  } else {
    out += '🎉 Selamat! Target sudah tercapai!\n';
    out += '🚀 Naikkan target jadi ' + (t + 10) + ' untuk terus berkembang.\n';
  }
  if(s >= 30) out += '\n🏆 Streak ' + s + ' hari — luar biasa!\n';
  else if(s >= 7) out += '\n🔥 Konsisten! Pertahankan streak-mu.\n';
  else if(s > 0) out += '\n💪 Bagus! Coba tingkatkan streak-mu.\n';
  else out += '\n⚠️ Ayo mulai streak hari ini!\n';
  out += '</div>';

  document.getElementById('sStats').innerHTML = out;
  if(window.SFX && SFX.ok) SFX.ok();
});

// Enter handlers
['iNiche','hTopic','cTopic','tNiche','scTopic','pTitle'].forEach(function(id){
  var el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('keydown', function(e){
    if(e.key !== 'Enter') return;
    e.preventDefault();
    var map = {iNiche:'iGo', hTopic:'hGo', cTopic:'cGo', tNiche:'tGo', scTopic:'scGo', pTitle:'pGo'};
    var btn = document.getElementById(map[id]);
    if(btn) btn.click();
  });
});

})();
</script>

<!-- ============ PWA ============ -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js', { scope: '../' })
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW failed:', err));
    });
  }
</script>
