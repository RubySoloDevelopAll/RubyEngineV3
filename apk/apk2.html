<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kalkulator USD · RubyEngine</title>

<!-- ====== PWA META ====== -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RubyEngine">
<link rel="apple-touch-icon" href="../image/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../image/icon-192.png">

<style>
:root{--bg:#0a1410;--card:#0f1f18;--fg:#e8f5ee;--mut:#6f8a7d;--acc:#3ddc84;--acc2:#ffd166;--line:rgba(61,220,132,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#0f2419,#0a1410 65%);color:var(--fg);min-height:100dvh;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
.back:active{transform:scale(.93)}
h1{font-size:17px;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);padding:6px;border-radius:16px;border:1px solid var(--line);margin-bottom:16px}
.seg button{padding:12px;border-radius:12px;border:none;background:transparent;color:var(--mut);font-size:13.5px;font-weight:600;font-family:inherit;transition:.2s}
.seg button.on{background:linear-gradient(135deg,var(--acc),#2bb56b);color:#0a1410;box-shadow:0 6px 20px rgba(61,220,132,.3)}
.f{margin-bottom:14px}
.f label{display:block;font-size:12px;color:var(--mut);margin-bottom:6px;letter-spacing:.3px}
.f input{width:100%;padding:15px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:16px;font-family:inherit;font-weight:600}
.f input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(61,220,132,.15)}
.go{width:100%;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#2bb56b);color:#0a1410;font-size:15px;font-weight:700;border:none;font-family:inherit;box-shadow:0 8px 24px rgba(61,220,132,.3);transition:transform .12s}
.go:active{transform:scale(.97)}
.res{margin-top:16px;padding:22px 16px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(61,220,132,.08),rgba(61,220,132,.02));text-align:center}
.res .l{font-size:12px;color:var(--mut);letter-spacing:1px}
.res .v{font-size:30px;font-weight:800;color:var(--acc2);margin-top:6px;word-break:break-all}
</style></head><body>
<div class="top"><a class="back" href="../apk.html">←</a><h1>Kalkulator USD</h1></div>
<div class="seg" id="seg">
<button class="on" data-m="i2u">IDR → USD</button>
<button data-m="u2i">USD → IDR</button>
</div>
<div class="f"><label>Kurs (1 USD = Rp)</label><input id="rate" type="number" inputmode="decimal" value="16000"></div>
<div class="f"><label id="li">Jumlah IDR</label><input id="amt" type="number" inputmode="decimal" placeholder="0"></div>
<button class="go" id="go">Konversi</button>
<div class="res"><div class="l" id="lo">HASIL</div><div class="v" id="out">—</div></div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var mode='i2u';
document.getElementById('seg').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#seg button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');mode=b.dataset.m;
  document.getElementById('li').textContent=mode==='i2u'?'Jumlah IDR':'Jumlah USD';
  document.getElementById('lo').textContent=mode==='i2u'?'HASIL (USD)':'HASIL (IDR)';
  document.getElementById('out').textContent='—';
  SFX.tap();
});
document.getElementById('go').addEventListener('click',function(){
  var r=parseFloat(document.getElementById('rate').value)||0;
  var a=parseFloat(document.getElementById('amt').value)||0;
  if(r<=0){document.getElementById('out').textContent='Kurs invalid';SFX.err();return}
  var out;
  if(mode==='i2u') out='$ '+(a/r).toFixed(2);
  else out='Rp '+Math.round(a*r).toLocaleString('id-ID');
  document.getElementById('out').textContent=out;SFX.ok();
});
})();
</script>

<!-- ====== PWA: Register Service Worker ====== -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js', { scope: '../' })
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW failed:', err));
    });
  }
</script>
</body></html>
