<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Spin Wheel · RubyEngine</title>

<!-- ====== PWA META ====== -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RubyEngine">
<link rel="apple-touch-icon" href="../image/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../image/icon-192.png">

<style>
:root{--bg:#1a0a2e;--card:#2a1240;--fg:#f0e8ff;--mut:#a888c8;--acc:#c084fc;--acc2:#22d3ee;--line:rgba(192,132,252,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#3a1a5c,#1a0a2e 65%);color:var(--fg);min-height:100dvh;padding:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700}
.wheel-wrap{position:relative;margin:0 auto 16px;max-width:320px;aspect-ratio:1/1}
canvas{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 40px rgba(192,132,252,.35))}
.pointer{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:32px;color:var(--acc2);z-index:2;filter:drop-shadow(0 0 12px rgba(34,211,238,.8))}
.result{text-align:center;padding:16px;border-radius:18px;background:linear-gradient(180deg,rgba(192,132,252,.12),rgba(34,211,238,.06));border:1px solid var(--line);margin-bottom:14px;min-height:70px;display:grid;place-items:center}
.result .rl{font-size:11px;color:var(--mut);letter-spacing:1.5px}
.result .rv{font-size:24px;font-weight:900;color:var(--acc2);margin-top:6px;word-break:break-word}
.go{width:100%;padding:18px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0a2e;font-size:17px;font-weight:900;border:none;font-family:inherit;box-shadow:0 8px 28px rgba(192,132,252,.4);margin-bottom:14px}
.go:active{transform:scale(.97)}
.go:disabled{opacity:.5}
.sec{margin-bottom:14px}
.sec h3{font-size:12px;color:var(--mut);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
.add{display:flex;gap:8px}
.add input{flex:1;padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:14px;font-family:inherit}
.add button{padding:0 16px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--acc);font-weight:800;font-family:inherit;font-size:18px}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.opt{padding:7px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;display:flex;gap:6px;align-items:center}
.opt button{background:none;border:none;color:var(--mut);font-size:14px;padding:0 2px}
.pre{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.pre::-webkit-scrollbar{display:none}
.pre button{flex-shrink:0;padding:8px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:12.5px;font-family:inherit}
.pre button:active{border-color:var(--acc);color:var(--acc)}
.hist{padding:12px;border-radius:14px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mut);min-height:40px}
.hist b{color:var(--acc2)}
</style></head><body>
<div class="top"><a class="back" href="../apk.html">←</a><h1>Spin Wheel</h1></div>
<div class="wheel-wrap">
<div class="pointer">▼</div>
<canvas id="cv"></canvas>
</div>
<div class="result"><div><div class="rl">HASIL</div><div class="rv" id="res">—</div></div></div>
<button class="go" id="spin">🎡 PUTAR</button>
<div class="sec"><h3>Preset</h3>
<div class="pre" id="pre">
<button data-p="makanan">🍕 Makanan</button>
<button data-p="game">🎮 Game</button>
<button data-p="aktivitas">🏃 Aktivitas</button>
<button data-p="tantangan">🔥 Tantangan</button>
<button data-p="nama">👥 Nama Pemain</button>
</div></div>
<div class="sec"><h3>Pilihan</h3>
<div class="add"><input id="in" placeholder="Tambah pilihan…"><button id="add">+</button></div>
<div class="opts" id="opts"></div>
</div>
<div class="sec"><h3>Riwayat</h3><div class="hist" id="hist">Belum ada spin…</div></div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var PRESETS={
  makanan:['Pizza','Bakso','Mie Ayam','Nasi Goreng','Burger','Sushi','Sate','Rendang'],
  game:['ML','PUBG','Free Fire','Valorant','Genshin','Roblox','Minecraft','Among Us'],
  aktivitas:['Jogging','Baca buku','Nonton film','Bersepeda','Berenang','Yoga','Tidur','Ngoding'],
  tantangan:['Push up 20x','Nyanyi 1 lagu','Dance 15s','Tahan ketawa','Plank 1 menit','Bilang pantun'],
  nama:['Andi','Budi','Citra','Dewi','Eka','Fajar','Gita','Hana','Indra','Joko']
};
var COLORS=['#ff6b6b','#ffd166','#06d6a0','#22d3ee','#a78bfa','#f15bb5','#fb923c','#4ade80','#60a5fa','#facc15'];
var items=['Pizza','Bakso','Mie Ayam','Nasi Goreng','Burger'];
var rot=0,spinning=false,hist=[];
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function size(){var r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
function draw(){
  var w=cv.clientWidth,h=cv.clientHeight,cx=w/2,cy=h/2,R=Math.min(w,h)/2-6;
  ctx.clearRect(0,0,w,h);
  var n=items.length;
  if(!n){ctx.fillStyle='#2a1240';ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fill();return}
  var arc=2*Math.PI/n;
  for(var i=0;i<n;i++){
    var a0=rot+i*arc,a1=a0+arc;
    ctx.fillStyle=COLORS[i%COLORS.length];
    ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a0,a1);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=2;ctx.stroke();
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+arc/2);
    ctx.fillStyle='#1a0a2e';ctx.font='bold '+Math.max(11,R*0.09)+'px system-ui';ctx.textAlign='right';ctx.textBaseline='middle';
    var txt=items[i].length>12?items[i].slice(0,11)+'…':items[i];
    ctx.fillText(txt,R-12,0);ctx.restore();
  }
  ctx.fillStyle='#1a0a2e';ctx.beginPath();ctx.arc(cx,cy,R*0.16,0,7);ctx.fill();
  ctx.strokeStyle='#22d3ee';ctx.lineWidth=3;ctx.stroke();
  ctx.fillStyle='#22d3ee';ctx.font='bold '+(R*0.16)+'px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('GO',cx,cy);
}
function renderOpts(){
  var box=document.getElementById('opts');box.innerHTML='';
  items.forEach(function(it,i){
    var el=document.createElement('div');el.className='opt';
    el.innerHTML='<span></span><button>✕</button>';
    el.querySelector('span').textContent=it;
    el.querySelector('button').addEventListener('click',function(){items.splice(i,1);renderOpts();draw();SFX.tap()});
    box.appendChild(el);
  });
  draw();
}
document.getElementById('add').addEventListener('click',function(){
  var v=document.getElementById('in').value.trim();if(!v)return;
  items.push(v);document.getElementById('in').value='';renderOpts();SFX.tap();
});
document.getElementById('in').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('add').click()});
document.getElementById('pre').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  items=PRESETS[b.dataset.p].slice();renderOpts();SFX.ok();
});
document.getElementById('spin').addEventListener('click',function(){
  if(spinning||items.length<2)return;
  spinning=true;this.disabled=true;
  var n=items.length;
  var extra=Math.PI*2*(3+Math.random()*3);
  var target=Math.random()*Math.PI*2;
  var start=rot,end=target+extra;
  var dur=4000,t0=performance.now();
  var tickN=0;
  function anim(t){
    var p=Math.min(1,(t-t0)/dur);
    var e=1-Math.pow(1-p,3);
    rot=start+(end-start)*e;
    var ticks=Math.floor(p*n*4);
    if(ticks!==tickN){tickN=ticks;SFX.tick()}
    draw();
    if(p<1)requestAnimationFrame(anim);
    else finish();
  }
  requestAnimationFrame(anim);
  function finish(){
    var arc=Math.PI*2/n;
    var a=((-Math.PI/2)-rot)%(Math.PI*2);if(a<0)a+=Math.PI*2;
    var idx=Math.floor(a/arc)%n;
    var win=items[idx];
    document.getElementById('res').textContent=win;
    hist.unshift(win);if(hist.length>8)hist.pop();
    document.getElementById('hist').innerHTML=hist.map(function(h){return '<b>'+h+'</b>'}).join(' • ');
    spinning=false;document.getElementById('spin').disabled=false;
    SFX.win();if(navigator.vibrate)navigator.vibrate([80,50,120]);
  }
});
renderOpts();size();
window.addEventListener('resize',function(){size();draw()});
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js', { scope: '../' })
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW failed:', err));
    });
  }
</script>
</body></html>
