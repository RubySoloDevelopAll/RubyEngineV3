<style>
:root{--bg:#02101a;--card:#0a1e30;--fg:#e0f4ff;--mut:#6a92b8;--acc:#22d3ee;--acc2:#f472b6;--line:rgba(34,211,238,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#0a2b45,#02101a 65%);color:var(--fg);min-height:100dvh;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700;flex:1}
.hud{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.hud div{padding:10px;border-radius:12px;background:var(--card);border:1px solid var(--line);text-align:center}
.hud .l{font-size:10px;color:var(--mut);letter-spacing:1px}
.hud b{display:block;font-size:28px;font-weight:900;margin-top:2px}
.hud .p b{color:var(--acc)}.hud .a b{color:var(--acc2)}
.serve-info{text-align:center;padding:9px;border-radius:12px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;font-size:12.5px;font-weight:800;letter-spacing:1.2px;transition:.25s}
.serve-info.p{color:var(--acc);border-color:var(--acc);box-shadow:0 0 20px rgba(34,211,238,.3)}
.serve-info.a{color:var(--acc2);border-color:var(--acc2);box-shadow:0 0 20px rgba(244,114,182,.3)}
.wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#01080f;margin-bottom:12px}
canvas{display:block;width:100%;aspect-ratio:3/4;touch-action:none}
.ctrl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ctrl button{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--fg);font-size:13px;font-weight:700;font-family:inherit}
.ov{position:absolute;inset:0;display:grid;place-items:center;z-index:5;overflow:hidden;
  background:
    radial-gradient(120% 80% at 50% 20%, rgba(34,211,238,.10), transparent 60%),
    linear-gradient(180deg, rgba(2,16,26,.94), rgba(2,16,26,.99));
  backdrop-filter:blur(10px);
  padding:18px;}
.ov::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent 0 3px, rgba(34,211,238,.05) 3px 4px);
  mix-blend-mode:screen;}
.menu-pp{position:relative;width:100%;max-width:320px;display:flex;flex-direction:column;align-items:center;gap:12px;z-index:1;font-family:'Courier New',ui-monospace,monospace}
.pp-title{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;letter-spacing:3px;line-height:1}
.pp-p1{color:var(--acc);text-shadow:0 0 6px var(--acc),0 0 22px rgba(34,211,238,.5)}
.pp-p2{color:var(--acc2);text-shadow:0 0 6px var(--acc2),0 0 22px rgba(244,114,182,.5)}
.pp-ball{display:inline-block;width:14px;height:14px;border-radius:50%;background:#fff;
  box-shadow:0 0 14px #fff,0 0 30px rgba(255,255,255,.5);
  animation:ppBounce 1.3s ease-in-out infinite}
@keyframes ppBounce{
  0%,100%{transform:translateY(-7px) scale(1)}
  50%{transform:translateY(7px) scale(.82)}
}
.pp-sub{font-size:10px;color:var(--mut);letter-spacing:3.5px;font-family:inherit;
  animation:ppBlink 2s steps(2) infinite}
@keyframes ppBlink{50%{opacity:.3}}
.pp-section{width:100%;display:flex;flex-direction:column;gap:6px}
.pp-label{font-size:9.5px;color:var(--mut);letter-spacing:2.5px;font-weight:700;font-family:inherit;padding-left:2px}
.pp-seg{display:grid;grid-template-columns:1fr 1fr 1fr;background:rgba(10,30,48,.85);
  border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.pp-seg button{padding:9px 0;border:none;background:transparent;color:var(--mut);
  font-family:inherit;font-size:10.5px;font-weight:800;letter-spacing:1.5px;
  border-radius:8px;cursor:pointer;transition:.15s;-webkit-tap-highlight-color:transparent}
.pp-seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));
  color:#02101a;box-shadow:0 4px 16px rgba(34,211,238,.4),0 0 0 1px rgba(255,255,255,.2) inset}
.pp-targets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.pp-targets button{padding:10px 0;border:1px solid var(--line);background:rgba(10,30,48,.6);
  color:var(--fg);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;
  align-items:center;gap:1px;font-family:inherit;transition:.15s;
  -webkit-tap-highlight-color:transparent}
.pp-targets button b{font-size:17px;font-weight:900;color:var(--acc);letter-spacing:.5px}
.pp-targets button span{font-size:8.5px;color:var(--mut);letter-spacing:1px}
.pp-targets button.on{border-color:var(--acc);background:rgba(34,211,238,.14);
  box-shadow:inset 0 0 16px rgba(34,211,238,.25),0 0 14px rgba(34,211,238,.2)}
.pp-targets button.on b{color:var(--acc2);text-shadow:0 0 10px currentColor}
.pp-start{width:100%;padding:15px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--acc),var(--acc2));color:#02101a;
  font-family:inherit;font-size:14px;font-weight:900;letter-spacing:3px;
  border-radius:14px;position:relative;overflow:hidden;
  animation:ppPulse 2s infinite;-webkit-tap-highlight-color:transparent}
.pp-start::after{content:'';position:absolute;inset:0;
  background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
  transform:translateX(-100%);animation:ppShine 2.6s infinite}
.pp-start:active{transform:scale(.97)}
@keyframes ppPulse{
  0%{box-shadow:0 0 0 0 rgba(34,211,238,.55),0 6px 20px rgba(244,114,182,.35)}
  70%{box-shadow:0 0 0 14px rgba(34,211,238,0),0 6px 20px rgba(244,114,182,.35)}
  100%{box-shadow:0 0 0 0 rgba(34,211,238,0),0 6px 20px rgba(244,114,182,.35)}
}
@keyframes ppShine{100%{transform:translateX(100%)}}
.pp-hint{font-size:9.5px;color:var(--mut);letter-spacing:1.5px;font-family:inherit;
  animation:ppBlink 3s steps(2) infinite}
.menu-pp.over .pp-section,
.menu-pp.over .pp-hint{display:none}
.menu-pp.over .pp-title{font-size:22px;letter-spacing:2px}
.menu-pp.over .pp-sub{animation:none;color:var(--fg);letter-spacing:2px;font-size:14px;font-weight:800}
.menu-pp.over .pp-sub b{color:var(--acc);text-shadow:0 0 10px currentColor}
.menu-pp.over .pp-start{animation:none;box-shadow:0 6px 24px rgba(34,211,238,.5)}
</style></head><body>
<div class="top"><a class="back" href="../game.html">←</a><h1>Ping Pong</h1></div>
<div class="hud">
<div class="p"><div class="l">KAMU</div><b id="sp">0</b></div>
<div class="a"><div class="l">AI</div><b id="sa">0</b></div>
</div>
<div class="serve-info p" id="serveInfo">SERVE: KAMU</div>
<div class="wrap">
<canvas id="cv"></canvas>
<div class="ov" id="ov">
  <div class="menu-pp" id="menuPP">
    <div class="pp-title" id="ot">
      <span class="pp-p1">PING</span>
      <span class="pp-ball"></span>
      <span class="pp-p2">PONG</span>
    </div>
    <div class="pp-sub" id="op">// NEON TABLE ARCADE //</div>

    <div class="pp-section">
      <div class="pp-label">⚡ KESULITAN</div>
      <div class="pp-seg" id="diff">
        <button data-d="easy">EASY</button>
        <button class="on" data-d="normal">NORMAL</button>
        <button data-d="hard">HARD</button>
      </div>
    </div>

    <div class="pp-section">
      <div class="pp-label">◎ TARGET SKOR</div>
      <div class="pp-targets" id="to">
        <button data-t="5"><b>5</b><span>cepat</span></button>
        <button class="on" data-t="10"><b>10</b><span>standar</span></button>
        <button data-t="11"><b>11</b><span>klasik</span></button>
      </div>
    </div>

    <button class="pp-start" id="ob">▶ PRESS START</button>
    <div class="pp-hint">geser paddle · mukul bola</div>
  </div>
</div>
</div>
<div class="ctrl">
<button id="pause">❚❚ Pause</button>
<button id="reset">⟲ Reset</button>
</div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H,player,ai,ball,scoreP,scoreA,alive,paused,loop,diff,target;
var touchX,touchY,particles=[];
var serveOwner='player';
var waiting=false,serveTimer=0,frame=0;
var menu=document.getElementById('menuPP');

function size(){
  var r=cv.getBoundingClientRect();
  cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;
  ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  W=r.width;H=r.height;
}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function reset(){
  player={x:W/2,y:H-70,w:82,h:13,vx:0,vy:0,px:W/2,py:H-70};
  ai    ={x:W/2,y:70,w:82,h:13,vx:0,vy:0,px:W/2,py:70};
  ball  ={x:W/2,y:H/2,vx:0,vy:0,r:8};
  scoreP=0;scoreA=0;alive=false;paused=false;
  touchX=W/2;touchY=H-70;particles=[];frame=0;
  serveOwner=Math.random()<.5?'player':'ai';
  upd();prepareServe();
}
function upd(){document.getElementById('sp').textContent=scoreP;document.getElementById('sa').textContent=scoreA}
function setServeInfo(){
  var el=document.getElementById('serveInfo');
  el.className='serve-info '+(serveOwner==='player'?'p':'a');
  el.textContent='SERVE: '+(serveOwner==='player'?'KAMU':'AI');
}
function prepareServe(){
  setServeInfo();waiting=true;
  if(serveTimer)clearTimeout(serveTimer);
  if(serveOwner==='player'){
    ball.x=player.x;ball.y=player.y-player.h/2-ball.r-3;ball.vx=0;ball.vy=0;
  } else {
    ball.x=ai.x;ball.y=ai.y+ai.h/2+ball.r+3;ball.vx=0;ball.vy=0;
    serveTimer=setTimeout(aiServe,700);
  }
}
function playerServe(){
  if(!waiting||serveOwner!=='player'||!alive)return;
  waiting=false;
  var ang=(Math.random()*0.7-0.35);
  ball.vx=Math.sin(ang)*6;
  ball.vy=-Math.abs(Math.cos(ang)*6);
  SFX.shoot();
}
function aiServe(){
  if(!waiting||serveOwner!=='ai'||!alive)return;
  waiting=false;
  var ang=(Math.random()*0.7-0.35);
  ball.vx=Math.sin(ang)*6;
  ball.vy=Math.abs(Math.cos(ang)*6);
  SFX.shoot();
}
function addParticles(x,y,color){
  for(var i=0;i<18;i++){
    var a=Math.random()*Math.PI*2,sp=1+Math.random()*4;
    particles.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,c:color});
  }
}
function drawPaddle(p,color,active){
  ctx.save();
  if(active){ctx.shadowColor=color;ctx.shadowBlur=22;ctx.fillStyle=color}
  else{ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.2)'}
  var x=p.x-p.w/2,y=p.y-p.h/2;
  ctx.beginPath();
  if(ctx.roundRect){ctx.roundRect(x,y,p.w,p.h,6)}else{ctx.rect(x,y,p.w,p.h)}
  ctx.fill();
  if(active){
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.55)';
    ctx.fillRect(x+6,y+2,p.w-12,2);
  }
  ctx.restore();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0a1e30');g.addColorStop(.5,'#02101a');g.addColorStop(1,'#0a1e30');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(34,211,238,.2)';ctx.setLineDash([8,8]);ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H/2);ctx.lineTo(W,H/2);ctx.stroke();ctx.setLineDash([]);
  ctx.strokeStyle='rgba(34,211,238,.35)';ctx.lineWidth=2;ctx.strokeRect(1,1,W-2,H-2);
  ctx.fillStyle='rgba(244,114,182,.18)';ctx.fillRect(W/2-60,0,120,4);
  ctx.fillStyle='rgba(34,211,238,.18)';ctx.fillRect(W/2-60,H-4,120,4);

  drawPaddle(ai,'#f472b6',serveOwner==='ai'||(!waiting&&ball.vy<0));
  drawPaddle(player,'#22d3ee',serveOwner==='player'||(!waiting&&ball.vy>0));

  particles.forEach(function(p){
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,2.5,0,7);ctx.fill();
  });
  ctx.globalAlpha=1;

  ctx.shadowColor='#fff';ctx.shadowBlur=20;ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle=(serveOwner==='player'?'#22d3ee':'#f472b6');
  ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r*0.5,0,7);ctx.fill();

  if(waiting&&serveOwner==='player'){
    ctx.fillStyle='rgba(34,211,238,.9)';
    ctx.font='bold 12px system-ui';ctx.textAlign='center';
    ctx.fillText('TAP untuk serve', W/2, H/2 + 40);
  }
}
function checkPaddle(p, isPlayer){
  var halfW = p.w/2, halfH = p.h/2;
  var cx = Math.max(p.x - halfW, Math.min(ball.x, p.x + halfW));
  var cy = Math.max(p.y - halfH, Math.min(ball.y, p.y + halfH));
  var dx = ball.x - cx;
  var dy = ball.y - cy;
  var dist = Math.hypot(dx, dy);
  if(dist >= ball.r) return false;
  if(isPlayer && ball.vy < 0) return false;
  if(!isPlayer && ball.vy > 0) return false;
  var nx, ny;
  if(dist > 0.001){ nx = dx/dist; ny = dy/dist; }
  else { nx = 0; ny = isPlayer ? -1 : 1; }
  var overlap = ball.r - dist;
  ball.x += nx * overlap;
  ball.y += ny * overlap;
  var relVx = ball.vx - p.vx;
  var relVy = ball.vy - p.vy;
  var vn = relVx * nx + relVy * ny;
  if(vn < 0){
    ball.vx -= 1.7 * vn * nx;
    ball.vy -= 1.7 * vn * ny;
  }
  ball.vx += p.vx * 0.8;
  ball.vy += p.vy * 0.8;
  var sp = Math.hypot(ball.vx, ball.vy);
  if(sp > 0.001){
    if(sp < 5){ ball.vx = ball.vx/sp*5; ball.vy = ball.vy/sp*5; }
    else if(sp > 17){ ball.vx = ball.vx/sp*17; ball.vy = ball.vy/sp*17; }
  } else {
    ball.vy = isPlayer ? -5 : 5;
  }
  SFX.hit();
  if(navigator.vibrate) navigator.vibrate(12);
  addParticles(ball.x, ball.y, isPlayer ? '#22d3ee' : '#f472b6');
  return true;
}
function step(){
  if(!alive||paused)return;

  var oldPX = player.x, oldPY = player.y;
  player.x += (touchX - player.x) * 0.45;
  player.y += (touchY - player.y) * 0.45;
  player.x = clamp(player.x, player.w/2, W-player.w/2);
  player.y = clamp(player.y, H/2+player.h/2, H-player.h/2);
  player.vx = player.x - oldPX;
  player.vy = player.y - oldPY;

  var sp = diff==='easy' ? 0.08 : diff==='normal' ? 0.14 : 0.22;
  var oldAX = ai.x, oldAY = ai.y;
  var aiTX, aiTY;
  var homeY = ai.h/2 + 14;

  if(waiting){
    aiTX = ai.x; aiTY = ai.y;
  } else if(ball.vy < 0){
    var targetY = ai.h/2 + 22;
    var tPredict = Math.max(0, Math.min(120, (ball.y - targetY) / Math.max(0.001, -ball.vy)));
    var predictX = ball.x + ball.vx * tPredict;
    var period = W * 2;
    predictX = ((predictX % period) + period) % period;
    if(predictX > W) predictX = period - predictX;
    aiTX = predictX;
    aiTY = Math.max(ai.h/2, Math.min(H/2 - ai.h/2, ball.y - 18));
    if(diff === 'easy'){
      aiTX += Math.sin(frame * 0.06) * 40;
      aiTY += Math.cos(frame * 0.05) * 20;
    } else if(diff === 'normal'){
      aiTX += Math.sin(frame * 0.04) * 18;
    }
  } else {
    aiTX = W/2;
    aiTY = homeY;
  }
  ai.x += (aiTX - ai.x) * sp;
  ai.y += (aiTY - ai.y) * sp;
  ai.x = clamp(ai.x, ai.w/2, W-ai.w/2);
  ai.y = clamp(ai.y, ai.h/2, H/2-ai.h/2);
  ai.vx = ai.x - oldAX;
  ai.vy = ai.y - oldAY;

  if(waiting){
    if(serveOwner==='player'){
      ball.x = player.x;
      ball.y = player.y - player.h/2 - ball.r - 3;
    } else {
      ball.x = ai.x;
      ball.y = ai.y + ai.h/2 + ball.r + 3;
    }
    draw();return;
  }

  ball.x += ball.vx;
  ball.y += ball.vy;

  if(ball.x - ball.r < 0){ ball.x = ball.r; ball.vx = Math.abs(ball.vx); SFX.tap(); }
  if(ball.x + ball.r > W){ ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); SFX.tap(); }

  checkPaddle(player, true);
  checkPaddle(ai, false);

  if(ball.y - ball.r < 0){
    scoreP++;upd();addParticles(ball.x,0,'#22d3ee');
    SFX.win();if(navigator.vibrate)navigator.vibrate([60,40,80]);
    if(scoreP>=target)return over('KAMU');
    serveOwner='ai';
    prepareServe();return;
  }
  if(ball.y + ball.r > H){
    scoreA++;upd();addParticles(ball.x,H,'#f472b6');
    SFX.lose();
    if(scoreA>=target)return over('AI');
    serveOwner='player';
    prepareServe();return;
  }

  particles.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vx*=0.95;p.vy*=0.95;p.life-=0.025});
  particles=particles.filter(function(p){return p.life>0});
  draw();
}
function over(w){
  alive=false;waiting=false;clearInterval(loop);
  if(serveTimer)clearTimeout(serveTimer);
  menu.classList.add('over');
  var titleEl=document.getElementById('ot');
  if(w==='KAMU'){
    titleEl.innerHTML='<span class="pp-p1" style="letter-spacing:2px">🏆 VICTORY</span>';
  } else {
    titleEl.innerHTML='<span class="pp-p2" style="letter-spacing:2px">💀 GAME OVER</span>';
  }
  document.getElementById('op').innerHTML='SKOR <b>'+scoreP+'</b> — <b>'+scoreA+'</b> AI';
  document.getElementById('ob').textContent='↻ MAIN LAGI';
  document.getElementById('ov').style.display='grid';
  if(w==='KAMU'){SFX.win();if(navigator.vibrate)navigator.vibrate([80,50,120])}
  else{SFX.lose();if(navigator.vibrate)navigator.vibrate([120,60,120])}
}
function start(){
  if(serveTimer)clearTimeout(serveTimer);
  menu.classList.remove('over');
  document.getElementById('ot').innerHTML='<span class="pp-p1">PING</span><span class="pp-ball"></span><span class="pp-p2">PONG</span>';
  document.getElementById('op').textContent='// NEON TABLE ARCADE //';
  document.getElementById('ob').textContent='▶ PRESS START';
  reset();alive=true;frame=0;
  document.getElementById('ov').style.display='none';
  SFX.ok();
  clearInterval(loop);loop=setInterval(function(){frame++;step();},16);
}
document.getElementById('ob').addEventListener('click',start);
document.getElementById('pause').addEventListener('click',function(){
  if(!alive)return;paused=!paused;
  this.textContent=paused?'▶ Lanjut':'❚❚ Pause';SFX.tap();
});
document.getElementById('reset').addEventListener('click',function(){
  clearInterval(loop);if(serveTimer)clearTimeout(serveTimer);
  alive=false;paused=false;waiting=false;
  menu.classList.remove('over');
  document.getElementById('ot').innerHTML='<span class="pp-p1">PING</span><span class="pp-ball"></span><span class="pp-p2">PONG</span>';
  document.getElementById('op').textContent='// NEON TABLE ARCADE //';
  document.getElementById('ob').textContent='▶ PRESS START';
  document.getElementById('ov').style.display='grid';
  document.getElementById('pause').textContent='❚❚ Pause';
  reset();draw();
});
document.getElementById('diff').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#diff button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');diff=b.dataset.d;SFX.tap();
});
document.getElementById('to').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  document.querySelectorAll('#to button').forEach(function(x){x.classList.remove('on')});
  b.classList.add('on');target=parseInt(b.dataset.t);SFX.tap();
});
function move(e){
  var r=cv.getBoundingClientRect();
  var t=e.touches?e.touches[0]:e;
  touchX=t.clientX-r.left;touchY=t.clientY-r.top;
}
function onTap(){
  if(waiting&&serveOwner==='player'&&alive)playerServe();
}
cv.addEventListener('touchstart',function(e){e.preventDefault();move(e)},{passive:false});
cv.addEventListener('touchmove',function(e){e.preventDefault();move(e)},{passive:false});
cv.addEventListener('touchend',function(e){e.preventDefault();onTap()},{passive:false});
cv.addEventListener('mousemove',function(e){if(e.buttons)move(e)});
cv.addEventListener('click',function(){onTap()});
diff='normal';target=10;frame=0;
size();reset();draw();
window.addEventListener('resize',function(){size();reset();draw()});
})();
