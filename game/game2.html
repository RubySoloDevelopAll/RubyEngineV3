<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Star Run · RubyEngine</title>

<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RubyEngine">
<link rel="apple-touch-icon" href="../image/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../image/icon-192.png">

<style>
:root{--card:#160a1f;--fg:#f5e8ff;--mut:#7d6b96;--line:rgba(168,85,247,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,sans-serif;
  background:#0a0512;color:var(--fg);
  min-height:100dvh;
  padding:8px;
  padding-top:calc(8px + env(safe-area-inset-top));
  padding-bottom:calc(8px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  overflow:hidden;
}
.top{display:flex;align-items:center;gap:10px;flex-shrink:0}
.back{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:17px;flex-shrink:0}
.top h1{font-size:12px;font-weight:800;letter-spacing:.16em;opacity:.65}

.hud{flex-shrink:0;display:flex;gap:8px;justify-content:center}
.hud>div{
  display:flex;align-items:center;gap:6px;
  padding:7px 14px;border-radius:11px;
  background:var(--card);border:1px solid var(--line);
  font-size:13px;min-width:82px;justify-content:center;
}
.hud>div .ic{font-size:14px;line-height:1}
.hud b{color:#fff;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em}

.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.wrap{
  position:relative;
  width:min(100%, calc((100dvh - 130px) * 16 / 9), 880px);
  aspect-ratio:16/9;
  border-radius:14px;overflow:hidden;
  border:1px solid var(--line);
  background:#050208;
  box-shadow:0 0 40px -10px rgba(168,85,247,.5);
  cursor:pointer;touch-action:manipulation;
}
canvas{display:block;width:100%;height:100%;touch-action:manipulation}

.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(5,2,8,.88);backdrop-filter:blur(4px);text-align:center;padding:20px;z-index:5;transition:opacity .25s}
.ov.hidden{opacity:0;pointer-events:none}
.ov h2{font-size:26px;font-weight:900;letter-spacing:.1em;margin-bottom:12px;background:linear-gradient(135deg,#a855f7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov .stats{font-size:12.5px;color:var(--mut);margin-bottom:14px;letter-spacing:.05em;font-variant-numeric:tabular-nums}

.btn{
  width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#a855f7,#6366f1);
  color:#fff;font-size:22px;border:none;font-family:inherit;
  cursor:pointer;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  box-shadow:0 0 26px rgba(168,85,247,.65),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .12s;position:relative;z-index:10;pointer-events:auto;
}
.btn:active{transform:scale(.9)}
</style>
</head><body>

<div class="top">
  <a class="back" href="../game.html">←</a>
  <h1>STAR RUN</h1>
</div>

<!-- HUD DI ATAS CANVAS -->
<div class="hud">
  <div><span class="ic">⭐</span><b id="sc">0</b></div>
  <div><span class="ic">💎</span><b id="co">0</b></div>
  <div><span class="ic">🏆</span><b id="hi">0</b></div>
</div>

<div class="stage">
  <div class="wrap" id="wrap">
    <canvas id="cv"></canvas>
    <div class="ov" id="ov">
      <div>
        <h2 id="ot">STAR RUN</h2>
        <div class="stats" id="op">tap di mana saja untuk lompat</div>
        <button class="btn" id="ob" type="button">▶</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/sfx.js"></script>
  
  <script>
(function(){
'use strict';

// ========= SETUP =========
var cv = document.getElementById('cv');
var wrap = document.getElementById('wrap');
var ctx = cv.getContext('2d', { alpha: false });
var DPR = Math.min(window.devicePixelRatio || 1, 2);
var W, H, scale, ground;
var EF = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji","Android Emoji",sans-serif';

// ========= EMOJI SPRITE CACHE =========
var emojiCache = {};
function sprite(emoji){
  var s = emojiCache[emoji];
  if(s) return s;
  var S = 128;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var x = c.getContext('2d');
  x.font = Math.round(S*0.82) + 'px ' + EF;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(emoji, S/2, S/2);
  emojiCache[emoji] = c;
  return c;
}
function drawSprite(emoji, cx, cy, size, rot){
  var sp = sprite(emoji);
  if(rot){
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(rot);
    ctx.drawImage(sp, -size/2, -size/2, size, size);
    ctx.restore();
  } else {
    ctx.drawImage(sp, cx - size/2, cy - size/2, size, size);
  }
}

// ========= GLOW SPRITE =========
var glowCache = {};
function glowSprite(color){
  var g = glowCache[color];
  if(g) return g;
  var S = 64;
  var c = document.createElement('canvas');
  c.width = S; c.height = S;
  var x = c.getContext('2d');
  var rg = x.createRadialGradient(S/2, S/2, 0, S/2, S/2, S/2);
  rg.addColorStop(0, color);
  rg.addColorStop(1, 'rgba(0,0,0,0)');
  x.fillStyle = rg;
  x.fillRect(0, 0, S, S);
  glowCache[color] = c;
  return c;
}

// ========= SKY GRADIENT CACHE =========
var skyCache = {};
function getSky(palIdx){
  if(skyCache[palIdx]) return skyCache[palIdx];
  var P = PAL[palIdx & 3];
  var g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, P.a);
  g.addColorStop(0.75, P.b);
  g.addColorStop(1, '#000');
  skyCache[palIdx] = g;
  return g;
}

// ========= PALETTES =========
var PAL = [
  {a:'#3b0764', b:'#0a0512', acc:'#a855f7', sun:'#e0a3ff'},
  {a:'#4c0519', b:'#0a0208', acc:'#fb7185', sun:'#fda4af'},
  {a:'#082f49', b:'#020617', acc:'#22d3ee', sun:'#7dd3fc'},
  {a:'#1e1b4b', b:'#050510', acc:'#818cf8', sun:'#a5b4fc'}
];
function pal(){ return PAL[palIndex & 3]; }

// ========= SIZE =========
var resizeTimer = 0;
function size(){
  var r = cv.getBoundingClientRect();
  var w = Math.max(1, Math.round(r.width  * DPR));
  var h = Math.max(1, Math.round(r.height * DPR));
  if(cv.width !== w || cv.height !== h){
    cv.width = w; cv.height = h;
  }
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  W = r.width; H = r.height;
  scale = H / 180;
  ground = H - 26 * scale;
  skyCache = {};
}

// ========= STATE =========
var player, obstacles, coins, powerups, particles, popups, bgStars, nebulae;
var score, coinsGot, combo, maxCombo, alive, frame;
var gravity, speed, spawnTimer, coinTimer, powerTimer, shake, flash, palTimer, palIndex;
var hi = +(localStorage.getItem('starRun_hi') || 0);
var hiCoins = +(localStorage.getItem('starRun_coins') || 0);
var hiCombo = +(localStorage.getItem('starRun_combo') || 0);

// ========= NEBULAE =========
function makeNebulae(){
  nebulae = [];
  var colors = ['rgba(168,85,247,0.20)','rgba(34,211,238,0.15)','rgba(251,113,133,0.13)'];
  for(var i = 0; i < 3; i++){
    nebulae.push({
      x: Math.random()*W, y: Math.random()*H*0.7,
      r: 70 + Math.random()*50,
      c: colors[i],
      s: 0.05 + Math.random()*0.1
    });
  }
}

// ========= RESET =========
function reset(){
  player = {x:40*scale, y:ground-42*scale, w:36*scale, h:36*scale,
            vy:0, onG:true, jumps:0, shield:0, magnet:0, tilt:0};
  obstacles = []; coins = []; powerups = [];
  particles = []; popups = [];

  bgStars = [];
  for(var i = 0; i < 36; i++){
    var layer = Math.random();
    bgStars.push({
      x: Math.random()*W, y: Math.random()*H*0.75,
      r: layer*1.6 + 0.3,
      s: 0.1 + layer*0.5,
      a: 0.15 + layer*0.5
    });
  }
  makeNebulae();

  score = 0; coinsGot = 0; combo = 1; maxCombo = hiCombo;
  speed = 2.6; gravity = 0.72; frame = 0;
  spawnTimer = 70; coinTimer = 90; powerTimer = 380;
  shake = 0; flash = 0; palTimer = 0; palIndex = 0;
  alive = true;
  upd();
}

function upd(){
  document.getElementById('sc').textContent = Math.floor(score);
  document.getElementById('co').textContent = coinsGot;
  document.getElementById('hi').textContent = hi;
}

// ========= SPAWN OBSTACLE (7 TIPE) =========
function spawnObstacle(){
  var r = Math.random();
  if(r < 0.24){
    var hts = [30, 44, 58];
    var h = hts[(Math.random()*3)|0] * scale;
    obstacles.push({x:W+10, y:ground-h, w:(18+Math.random()*6)*scale, h:h, type:'g'});
  } else if(r < 0.42){
    var h = (74 + Math.random()*12) * scale;
    obstacles.push({x:W+10, y:ground-h, w:20*scale, h:h, type:'tall'});
  } else if(r < 0.58){
    obstacles.push({x:W+10, y:ground-30*scale, w:52*scale, h:30*scale, type:'wide'});
  } else if(r < 0.72){
    obstacles.push({x:W+10, y:ground-86*scale, w:28*scale, h:24*scale, type:'fly'});
  } else if(r < 0.82){
    obstacles.push({x:W+10, y:ground-50*scale, w:26*scale, h:20*scale, type:'flylow'});
  } else if(r < 0.91){
    obstacles.push({x:W+10, y:ground-38*scale, w:16*scale, h:38*scale, type:'spike'});
  } else {
    var h1 = (38 + Math.random()*10) * scale;
    var h2 = (46 + Math.random()*14) * scale;
    var g1w = 18*scale, g2w = 18*scale;
    obstacles.push({x:W+10, y:ground-h1, w:g1w, h:h1, type:'g'});
    obstacles.push({x:W+10+g1w+14*scale, y:ground-h2, w:g2w, h:h2, type:'g'});
  }
}

function spawnCoinArc(){
  var n = 1 + ((Math.random()*3)|0);
  var baseY = ground - 64*scale - Math.random()*42*scale;
  for(var i = 0; i < n; i++){
    coins.push({
      x: W + 10 + i*24*scale,
      y: baseY - Math.sin((i+1)/(n+1)*Math.PI)*24*scale,
      w: 14*scale, h: 14*scale
    });
  }
}

function spawnPowerup(){
  var t = Math.random() < 0.5 ? 'shield' : 'magnet';
  powerups.push({x:W+10, y:ground-76*scale-Math.random()*28*scale,
                 w:22*scale, h:22*scale, type:t, bob:0});
}

// ========= EFFECTS =========
var MAX_PARTICLES = 70;
function addParticles(x, y, color, n, opts){
  opts = opts || {};
  for(var i = 0; i < n; i++){
    if(particles.length >= MAX_PARTICLES) break;
    var life = opts.life || (26 + Math.random()*12);
    particles.push({
      x:x, y:y,
      vx: opts.vx !== undefined ? opts.vx : (Math.random()-0.5)*3,
      vy: opts.vy !== undefined ? opts.vy : (Math.random()-0.5)*3 - 1,
      life: life, maxLife: life,
      color: color,
      size: opts.size || (2 + Math.random()*2),
      grav: opts.grav !== undefined ? opts.grav : 0.15
    });
  }
}
function addPopup(x, y, text, color){
  popups.push({x:x, y:y, text:text, color:color||'#e0a3ff', life:36, maxLife:36});
}

// ========= INPUT =========
function jump(){
  if(!alive) return;
  if(player.onG){
    player.vy = -11.5; player.onG = false; player.jumps = 1;
    if(window.SFX && SFX.jump) SFX.jump();
    if(navigator.vibrate) navigator.vibrate(10);
    addParticles(player.x, player.y+player.h, '#a855f7', 4, {vy:1, grav:0.2});
  } else if(player.jumps < 2){
    player.vy = -10; player.jumps = 2;
    if(window.SFX && SFX.jump) SFX.jump();
    if(navigator.vibrate) navigator.vibrate(8);
    addParticles(player.x, player.y+player.h, '#22d3ee', 5, {vy:1, grav:0.2});
  }
}

// ========= STEP =========
function step(){
  frame++;
  palTimer++;
  if(palTimer > 600){ palTimer = 0; palIndex++; }

  player.vy += gravity;
  player.y += player.vy;
  var targetTilt = Math.max(-0.35, Math.min(0.5, player.vy*0.035));
  player.tilt += (targetTilt - player.tilt) * 0.2;
  if(player.y >= ground - player.h){
    player.y = ground - player.h;
    player.vy = 0;
    if(!player.onG){ addParticles(player.x, ground, '#a855f7', 3, {vy:0.5, grav:0.15}); }
    player.onG = true; player.jumps = 0;
    player.tilt += (0 - player.tilt) * 0.3;
  }

  if(player.shield > 0) player.shield--;
  if(player.magnet > 0) player.magnet--;

  if((frame & 1) === 0 && particles.length < MAX_PARTICLES - 5){
    particles.push({
      x: player.x - 2,
      y: player.y + player.h*0.55 + (Math.random()-0.5)*6,
      vx: -1.5 - Math.random()*2,
      vy: (Math.random()-0.5)*1.2,
      life: 12 + Math.random()*8, maxLife: 20,
      color: Math.random() < 0.5 ? '#fb923c' : (Math.random() < 0.6 ? '#facc15' : '#f87171'),
      size: 2 + Math.random()*2.2,
      grav: 0.05
    });
  }

  spawnTimer--;
  if(spawnTimer <= 0){ spawnObstacle(); spawnTimer = Math.max(32, 72 - speed*4 + Math.random()*20); }
  coinTimer--;
  if(coinTimer <= 0){ spawnCoinArc(); coinTimer = 90 + Math.random()*80; }
  powerTimer--;
  if(powerTimer <= 0){ spawnPowerup(); powerTimer = 400 + Math.random()*200; }

  for(var i = 0; i < bgStars.length; i++){
    var s = bgStars[i];
    s.x -= s.s * speed * 0.35;
    if(s.x < -3){ s.x = W + 3; s.y = Math.random()*H*0.75; }
  }
  for(var n = 0; n < nebulae.length; n++){
    var nb = nebulae[n];
    nb.x -= nb.s;
    if(nb.x < -nb.r) nb.x = W + nb.r;
  }

  for(i = obstacles.length - 1; i >= 0; i--){
    var o = obstacles[i];
    o.x -= speed;
    if(o.x + o.w < -10) obstacles.splice(i, 1);
  }

  for(i = coins.length - 1; i >= 0; i--){
    var c = coins[i];
    if(player.magnet > 0){
      var dx = (player.x + player.w/2) - (c.x + c.w/2);
      var dy = (player.y + player.h/2) - (c.y + c.h/2);
      var d2 = dx*dx + dy*dy;
      if(d2 < 16900*scale*scale && d2 > 1){
        var d = Math.sqrt(d2);
        c.x += dx/d * 3.4; c.y += dy/d * 3.4;
      }
    }
    c.x -= speed;
    if(c.x + c.w < -10) coins.splice(i, 1);
  }

  for(i = powerups.length - 1; i >= 0; i--){
    var p = powerups[i];
    p.x -= speed; p.bob += 0.1;
    if(p.x + p.w < -10) powerups.splice(i, 1);
  }

  for(i = particles.length - 1; i >= 0; i--){
    var pt = particles[i];
    pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.grav; pt.life--;
    if(pt.life <= 0) particles.splice(i, 1);
  }
  for(i = popups.length - 1; i >= 0; i--){
    var pp = popups[i];
    pp.y -= 0.8; pp.life--;
    if(pp.life <= 0) popups.splice(i, 1);
  }

  if(shake > 0.5) shake *= 0.85; else shake = 0;
  if(flash > 0.02) flash *= 0.9; else flash = 0;

  for(i = 0; i < obstacles.length; i++){
    var ob = obstacles[i];
    var hit = (player.x + player.w*0.25 < ob.x + ob.w*0.85 &&
               player.x + player.w*0.85 > ob.x + ob.w*0.15 &&
               player.y + player.h*0.2  < ob.y + ob.h &&
               player.y + player.h*0.85 > ob.y);
    if(hit){
      if(player.shield > 0){
        player.shield = 0; ob.dead = true;
        addParticles(ob.x + ob.w/2, ob.y + ob.h/2, '#22d3ee', 16, {size:3, grav:0.1});
        addPopup(ob.x, ob.y, 'SHIELD', '#22d3ee');
        shake = 10; flash = 0.7;
        if(window.SFX && SFX.ok) SFX.ok();
      } else {
        return over();
      }
    } else if(!ob.passed && ob.x + ob.w < player.x){
      ob.passed = true;
      combo = Math.min(combo + 1, 20);
      score += combo;
      if(combo > maxCombo){ maxCombo = combo; localStorage.setItem('starRun_combo', maxCombo); }
      if(combo % 5 === 0){
        addPopup(player.x + player.w, player.y, 'x' + combo, '#fb7185');
        shake = 4;
      }
    }
  }
  for(i = obstacles.length - 1; i >= 0; i--){
    if(obstacles[i].dead) obstacles.splice(i, 1);
  }

  for(i = coins.length - 1; i >= 0; i--){
    var cc = coins[i];
    if(player.x + player.w > cc.x && player.x < cc.x + cc.w &&
       player.y + player.h > cc.y && player.y < cc.y + cc.h){
      coinsGot++;
      var gain = 5 * combo;
      score += gain;
      addParticles(cc.x + cc.w/2, cc.y + cc.h/2, '#22d3ee', 6, {size:2.5, grav:0.15});
      addPopup(cc.x, cc.y, '+' + gain, '#7dd3fc');
      if(window.SFX && SFX.coin) SFX.coin();
      else if(window.SFX && SFX.tap) SFX.tap();
      coins.splice(i, 1);
    }
  }

  for(i = powerups.length - 1; i >= 0; i--){
    var pw = powerups[i];
    if(player.x + player.w > pw.x && player.x < pw.x + pw.w &&
       player.y + player.h > pw.y && player.y < pw.y + pw.h){
      if(pw.type === 'shield'){
        player.shield = 300;
        addPopup(pw.x, pw.y, 'SHIELD', '#22d3ee');
        flash = 0.5;
      } else {
        player.magnet = 300;
        addPopup(pw.x, pw.y, 'MAGNET', '#fb7185');
      }
      addParticles(pw.x + pw.w/2, pw.y + pw.h/2, '#ffffff', 10, {size:3});
      if(window.SFX && SFX.ok) SFX.ok();
      powerups.splice(i, 1);
    }
  }

  score += 0.12 + combo * 0.02;
  speed += 0.0012;

  if(Math.floor(score) > hi){ hi = Math.floor(score); localStorage.setItem('starRun_hi', hi); }
  if(coinsGot > hiCoins){ hiCoins = coinsGot; localStorage.setItem('starRun_coins', hiCoins); }

  upd();
}

// ========= DRAW =========
function draw(){
  var P = pal();
  ctx.save();
  if(shake > 0.5) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  ctx.fillStyle = getSky(palIndex);
  ctx.fillRect(-20, -20, W + 40, H + 40);

  for(var i = 0; i < nebulae.length; i++){
    var n = nebulae[i];
    var gs = glowSprite(n.c);
    ctx.globalAlpha = 0.9;
    ctx.drawImage(gs, n.x - n.r, n.y - n.r, n.r*2, n.r*2);
  }
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff';
  for(i = 0; i < bgStars.length; i++){
    var s = bgStars[i];
    ctx.globalAlpha = s.a;
    ctx.fillRect(s.x, s.y, s.r, s.r);
  }
  ctx.globalAlpha = 1;

  var cx = W - 56, cy = H*0.32;
  var pg = glowSprite(P.acc + '66');
  ctx.drawImage(pg, cx - 60, cy - 60, 120, 120);
  ctx.fillStyle = P.sun + 'cc';
  ctx.beginPath(); ctx.arc(cx, cy, 22, 0, 6.283); ctx.fill();
  ctx.fillStyle = P.acc + '44';
  ctx.beginPath(); ctx.arc(cx, cy, 30, 0, 6.283); ctx.fill();

  ctx.strokeStyle = P.acc;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, ground); ctx.lineTo(W, ground); ctx.stroke();

  ctx.lineWidth = 1;
  ctx.strokeStyle = P.acc + '30';
  ctx.beginPath();
  for(i = 0; i < W + 40; i += 40){
    var off = i - (frame * speed * 0.5) % 40;
    ctx.moveTo(off, ground + 4);
    ctx.lineTo(off - 10, H);
  }
  ctx.stroke();

  for(i = 0; i < obstacles.length; i++){
    var o = obstacles[i];
    var oc;
    if(o.type === 'fly') oc = '#fb7185';
    else if(o.type === 'flylow') oc = '#fb923c';
    else if(o.type === 'spike') oc = '#ef4444';
    else if(o.type === 'tall') oc = '#a855f7';
    else oc = '#22d3ee';

    var og = glowSprite(oc + '55');
    ctx.drawImage(og, o.x - o.w*0.6, o.y - o.h*0.6, o.w*2.2, o.h*2.2);

    ctx.fillStyle = oc + '33';
    ctx.strokeStyle = oc;
    ctx.lineWidth = 1.5;
    ctx.beginPath();

    if(o.type === 'fly' || o.type === 'flylow'){
      ctx.moveTo(o.x + o.w/2, o.y);
      ctx.lineTo(o.x + o.w, o.y + o.h/2);
      ctx.lineTo(o.x + o.w/2, o.y + o.h);
      ctx.lineTo(o.x, o.y + o.h/2);
      ctx.closePath();
    } else if(o.type === 'spike'){
      ctx.moveTo(o.x + o.w/2, o.y);
      ctx.lineTo(o.x + o.w, o.y + o.h);
      ctx.lineTo(o.x, o.y + o.h);
      ctx.closePath();
    } else {
      if(ctx.roundRect) ctx.roundRect(o.x, o.y, o.w, o.h, 4*scale);
      else ctx.rect(o.x, o.y, o.w, o.h);
    }
    ctx.fill(); ctx.stroke();

    ctx.fillStyle = oc;
    if(o.type === 'spike'){
      ctx.fillRect(o.x + o.w*0.4, o.y + o.h*0.35, o.w*0.2, o.h*0.5);
    } else {
      ctx.fillRect(o.x + o.w*0.38, o.y + 4*scale, o.w*0.24, o.h - 8*scale);
    }
  }

  var coinSize = coins.length ? coins[0].w * 1.35 : 20;
  for(i = 0; i < coins.length; i++){
    var c = coins[i];
    drawSprite('💎', c.x + c.w/2, c.y + c.h/2, coinSize);
  }

  for(i = 0; i < powerups.length; i++){
    var pw = powerups[i];
    var bobY = pw.y + pw.h/2 + Math.sin(pw.bob) * 3;
    drawSprite(pw.type === 'shield' ? '🛡️' : '🧲',
               pw.x + pw.w/2, bobY, pw.h * 1.4);
  }

  var pcx = player.x + player.w/2;
  var pcy = player.y + player.h/2;

  if(player.shield > 0){
    ctx.strokeStyle = 'rgba(34,211,238,' + (0.5 + Math.sin(frame*0.2)*0.3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(pcx, pcy, player.w*0.85, 0, 6.283); ctx.stroke();
  }
  if(player.magnet > 0){
    ctx.strokeStyle = 'rgba(251,113,133,' + (0.4 + Math.sin(frame*0.25)*0.25) + ')';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(pcx, pcy, player.w*0.75, 0, 6.283); ctx.stroke();
  }

  var eg = glowSprite('rgba(251,146,60,0.7)');
  ctx.drawImage(eg, pcx - player.w*1.0, pcy - player.w*0.7,
                player.w*1.4, player.w*1.4);

  drawSprite('🚀', pcx, pcy, player.h * 1.15, 0.78 + player.tilt);

  for(i = 0; i < particles.length; i++){
    var pt = particles[i];
    var a = pt.life / pt.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = pt.color;
    var sz = pt.size * a;
    ctx.fillRect(pt.x - sz/2, pt.y - sz/2, sz, sz);
  }
  ctx.globalAlpha = 1;

  ctx.font = 'bold 12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(i = 0; i < popups.length; i++){
    var pp = popups[i];
    ctx.globalAlpha = pp.life / pp.maxLife;
    ctx.fillStyle = pp.color;
    ctx.fillText(pp.text, pp.x, pp.y);
  }
  ctx.globalAlpha = 1;

  if(combo > 1){
    ctx.fillStyle = 'rgba(251,113,133,0.95)';
    ctx.font = 'bold 11px system-ui,sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText('×' + combo, 12, 10);
  }

  if(flash > 0.02){
    ctx.fillStyle = 'rgba(255,255,255,' + flash*0.35 + ')';
    ctx.fillRect(0, 0, W, H);
  }

  ctx.restore();
}

// ========= GAME OVER =========
function over(){
  alive = false;
  if(window.SFX && SFX.lose) SFX.lose();
  if(navigator.vibrate) navigator.vibrate([120, 60, 120]);
  addParticles(player.x + player.w/2, player.y + player.h/2, '#fb7185', 22, {size:3, grav:0.2});
  draw();
  document.getElementById('ot').textContent = 'GAME OVER';
  document.getElementById('op').innerHTML =
    '⭐' + Math.floor(score) + ' · 💎' + coinsGot + ' · ×' + maxCombo;
  document.getElementById('ob').textContent = '⟲';
  document.getElementById('ov').classList.remove('hidden');
}

// ========= LOOP =========
var rafId = 0, lastT = 0, acc = 0, STEP = 1000 / 60;
function tick(t){
  if(!alive){ rafId = 0; return; }
  if(!lastT) lastT = t;
  var dt = t - lastT;
  lastT = t;
  if(dt > 100) dt = 100;
  acc += dt;
  var iter = 0;
  while(acc >= STEP && iter < 5){ step(); acc -= STEP; iter++; }
  if(iter >= 5) acc = 0;
  draw();
  rafId = requestAnimationFrame(tick);
}

function start(){
  reset();
  document.getElementById('ov').classList.add('hidden');
  if(window.SFX && SFX.ok) SFX.ok();
  if(rafId) cancelAnimationFrame(rafId);
  lastT = 0; acc = 0;
  rafId = requestAnimationFrame(tick);
}

// ========= EVENTS =========
var btnPlay = document.getElementById('ob');

function onPlay(e){
  if(e){ e.preventDefault(); e.stopPropagation(); }
  start();
}
btnPlay.addEventListener('pointerdown', onPlay, { passive: false });
btnPlay.addEventListener('click', function(e){
  e.preventDefault(); e.stopPropagation(); start();
});

// Tap di area game saja
wrap.addEventListener('pointerdown', function(e){
  if(e.target.closest('button, a')) return;
  if(!alive) return;
  e.preventDefault();
  jump();
}, { passive: false });

// Keyboard
document.addEventListener('keydown', function(e){
  if(e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W'){
    e.preventDefault();
    if(alive) jump();
    else if(!document.getElementById('ov').classList.contains('hidden')) start();
  }
}, { passive: false });

window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    size(); makeNebulae();
    if(!alive) draw();
  }, 120);
});

window.addEventListener('orientationchange', function(){
  setTimeout(function(){ size(); makeNebulae(); if(!alive) draw(); }, 250);
});

// ========= BOOT =========
size();
reset();
alive = false;
draw();

})();
