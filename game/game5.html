<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Flappy · RubyEngine</title>

<!-- ====== PWA META ====== -->
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RubyEngine">
<link rel="apple-touch-icon" href="../image/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="../image/icon-192.png">

<style>
:root{--bg:#0a2540;--card:#0f3455;--fg:#e0f2ff;--mut:#6f95b8;--acc:#fbbf24;--acc2:#22d3ee;--line:rgba(34,211,238,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:radial-gradient(140% 80% at 50% 0%,#1a4d7a,#0a2540 65%);color:var(--fg);min-height:100dvh;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.back{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;color:var(--fg);text-decoration:none;font-size:20px}
h1{font-size:17px;font-weight:700}
.hud{display:flex;justify-content:space-between;padding:12px 16px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:12px}
.hud span{font-size:11px;color:var(--mut);letter-spacing:.5px}
.hud b{display:block;color:var(--acc);font-size:17px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.wrap{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:#0a1a2d}
canvas{display:block;width:100%;aspect-ratio:3/4;touch-action:manipulation}
.ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(10,37,64,.9);backdrop-filter:blur(8px);text-align:center;padding:20px;z-index:5}
.ov h2{font-size:22px;margin-bottom:8px;color:var(--acc);text-shadow:0 0 20px rgba(251,191,36,.5)}
.ov p{color:var(--mut);font-size:13px;margin-bottom:16px}
.btn{padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#e0a800);color:#0a2540;font-size:15px;font-weight:800;border:none;font-family:inherit;box-shadow:0 8px 24px rgba(251,191,36,.35)}
.btn:active{transform:scale(.97)}
.hint{text-align:center;font-size:12px;color:var(--mut);margin-top:10px}
</style></head><body>
<div class="top"><a class="back" href="../game.html">←</a><h1>Flappy</h1></div>
<div class="hud"><span>SKOR<b id="sc">0</b></span><span>HIGH<b id="hi">0</b></span></div>
<div class="wrap">
<canvas id="cv"></canvas>
<div class="ov" id="ov"><div><h2 id="ot">Flappy</h2><p id="op">Tap untuk terbang</p><button class="btn" id="ob">▶ Mulai</button></div></div>
</div>
<div class="hint">👆 Tap area permainan</div>
<script src="../js/sfx.js"></script>
<script>
(function(){
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
var W,H,bird,pipes,score,loop,alive,frame,gravity,lastGap;
var hi=+(localStorage.getItem('flappy2_hi')||0);
function size(){var r=cv.getBoundingClientRect();cv.width=r.width*devicePixelRatio;cv.height=r.height*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=r.width;H=r.height}
function reset(){bird={x:W*.28,y:H*.5,r:13,vy:0,rot:0};pipes=[];score=0;frame=0;gravity=0.5;lastGap=0;alive=true;upd()}
function upd(){document.getElementById('sc').textContent=score;document.getElementById('hi').textContent=hi}
function flap(){if(!alive)return;bird.vy=-7.8;SFX.jump();if(navigator.vibrate)navigator.vibrate(10)}
function draw(){
  var g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1a4d7a');g.addColorStop(.7,'#0f3455');g.addColorStop(1,'#0a1a2d');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.06)';
  for(var i=0;i<5;i++){var cx=(i*130+frame*.4)%(W+80)-40,cy=40+i*30;ctx.beginPath();ctx.arc(cx,cy,26,0,7);ctx.arc(cx+22,cy+6,20,0,7);ctx.arc(cx-22,cy+6,18,0,7);ctx.fill()}
  pipes.forEach(function(p){
    var pg=ctx.createLinearGradient(p.x,0,p.x+p.w,0);
    pg.addColorStop(0,'#4ade80');pg.addColorStop(.5,'#22c55e');pg.addColorStop(1,'#15803d');
    ctx.fillStyle=pg;
    ctx.fillRect(p.x,0,p.w,p.top);
    ctx.fillRect(p.x,p.top+p.gap,p.w,H-(p.top+p.gap));
    ctx.fillStyle='rgba(255,255,255,.2)';
    ctx.fillRect(p.x+4,0,3,p.top);
    ctx.fillRect(p.x+4,p.top+p.gap,3,H-(p.top+p.gap));
    ctx.fillStyle='#166534';
    ctx.fillRect(p.x-3,p.top-8,p.w+6,8);
    ctx.fillRect(p.x-3,p.top+p.gap,p.w+6,8);
  });
  ctx.save();ctx.translate(bird.x,bird.y);ctx.rotate(Math.max(-0.5,Math.min(0.8,bird.vy*.06)));
  ctx.shadowColor='#fbbf24';ctx.shadowBlur=18;
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.ellipse(0,0,bird.r,bird.r*.85,0,0,7);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(bird.r-1,0);ctx.lineTo(bird.r+8,2);ctx.lineTo(bird.r-1,5);ctx.closePath();ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(4,-3,3.5,0,7);ctx.fill();
  ctx.fillStyle='#0a2540';ctx.beginPath();ctx.arc(5,-3,1.8,0,7);ctx.fill();
  ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.ellipse(-4,2,6,4,-.3,0,7);ctx.fill();
  ctx.restore();
}
function step(){
  if(!alive)return;frame++;
  bird.vy+=gravity;bird.y+=bird.vy;
  if(bird.y-bird.r<0||bird.y+bird.r>H){return over()}
  var gap=H*.28;
  if(frame%Math.max(62,100-Math.min(score,50))===0){
    var minTop=50,maxTop=H-gap-90;
    pipes.push({x:W,w:58,top:Math.random()*(maxTop-minTop)+minTop,gap:gap,passed:false});
  }
  pipes.forEach(function(p){p.x-=2.8});
  pipes=pipes.filter(function(p){return p.x+p.w>-5});
  for(var i=0;i<pipes.length;i++){
    var p=pipes[i];
    if(bird.x+bird.r*.7>p.x&&bird.x-bird.r*.7<p.x+p.w){
      if(bird.y-bird.r*.7<p.top||bird.y+bird.r*.7>p.top+p.gap)return over();
    }
    if(!p.passed&&p.x+p.w<bird.x){p.passed=true;score++;if(score>hi){hi=score;localStorage.setItem('flappy2_hi',hi)}upd();SFX.pickup()}
  }
  draw();
}
function over(){alive=false;clearInterval(loop);SFX.hit();setTimeout(function(){SFX.lose()},150);
  if(navigator.vibrate)navigator.vibrate([120,60,120]);
  document.getElementById('ot').textContent='Game Over';
  document.getElementById('op').textContent='Skor: '+score+' • High: '+hi;
  document.getElementById('ob').textContent='⟲ Main Lagi';
  document.getElementById('ov').style.display='grid';
}
function start(){reset();document.getElementById('ov').style.display='none';SFX.ok();
  clearInterval(loop);loop=setInterval(step,16);}
cv.addEventListener('click',function(){if(alive)flap()});
document.getElementById('ob').addEventListener('click',start);
window.addEventListener('resize',function(){size();if(!alive)draw()});
size();reset();alive=false;draw();
})();
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('../sw.js', { scope: '../' })
        .then(reg => console.log('[PWA] SW registered:', reg.scope))
        .catch(err => console.warn('[PWA] SW failed:', err));
    });
  }
</script>
</body></html>
