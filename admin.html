<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Panel — RubyEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />

<!-- ====== PWA META ====== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RubyEngine">

<link rel="icon" type="image/png" sizes="32x32" href="image/icon-192.png">

<style>
  body.adm-body {
    background: #05060a;
    min-height: 100vh;
    overflow-x: hidden;
  }
  .adm-shell {
    max-width: 900px;
    margin: 0 auto;
    padding: 26px 20px 60px;
  }
  .adm-head {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 20px;
    border-radius: 16px;
    background: linear-gradient(180deg, rgba(124,92,255,0.10), rgba(124,92,255,0.02));
    border: 1px solid rgba(124,92,255,0.28);
    margin-bottom: 22px;
  }
  .adm-head-icon {
    width: 46px; height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #7c5cff, #4f8cff);
    display: grid; place-items: center;
    color: #fff;
    flex-shrink: 0;
    box-shadow: 0 10px 26px rgba(124,92,255,0.4);
  }
  .adm-head-info { flex: 1; min-width: 0; }
  .adm-head-title {
    font-size: 11px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    font-weight: 700;
    margin-bottom: 3px;
  }
  .adm-head-name {
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.01em;
  }
  .adm-badge {
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(124,92,255,0.16);
    border: 1px solid rgba(124,92,255,0.4);
    color: #a78bfa;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .adm-stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 22px;
  }
  .adm-stat {
    padding: 14px 10px;
    border-radius: 14px;
    background: var(--bg-1);
    border: 1px solid var(--border);
    text-align: center;
  }
  .adm-stat .lbl {
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(255,255,255,0.4);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .adm-stat .val {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .adm-stat.acc   .val { color: #7c5cff; }
  .adm-stat.ok    .val { color: #22c55e; }
  .adm-stat.warn  .val { color: #f59e0b; }
  .adm-stat.err   .val { color: #f87171; }

  .adm-card {
    padding: 22px 20px;
    border-radius: 18px;
    background: linear-gradient(180deg, #0e111a, #090b12);
    border: 1px solid rgba(255,255,255,0.07);
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    margin-bottom: 22px;
  }
  .adm-card-title {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    margin-bottom: 18px;
  }
  .adm-card-title::before {
    content: '';
    width: 3px; height: 16px;
    border-radius: 2px;
    background: linear-gradient(180deg, #7c5cff, #4f8cff);
    box-shadow: 0 0 12px rgba(124,92,255,0.6);
  }
  .adm-field { margin-bottom: 14px; }
  .adm-field label {
    display: block;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    margin-bottom: 7px;
  }
  .adm-input {
    width: 100%;
    padding: 13px 16px;
    border-radius: 12px;
    background: #050608;
    border: 1px solid rgba(255,255,255,0.07);
    color: #fff;
    font-size: 14.5px;
    font-family: inherit;
    outline: none;
    transition: all 0.2s ease;
  }
  .adm-input:focus {
    border-color: rgba(124,92,255,0.55);
    box-shadow: 0 0 0 4px rgba(124,92,255,0.12);
  }
  .adm-pass-wrap { display: flex; gap: 8px; }
  .adm-pass-wrap .adm-input { flex: 1; }
  .adm-gen {
    padding: 0 14px;
    border-radius: 12px;
    background: rgba(124,92,255,0.12);
    border: 1px solid rgba(124,92,255,0.4);
    color: #a78bfa;
    font-size: 12px;
    font-weight: 800;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s ease;
  }
  .adm-gen:hover { background: rgba(124,92,255,0.2); }
  .adm-gen:active { transform: scale(0.96); }

  .adm-role {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .adm-role button {
    padding: 11px;
    border-radius: 11px;
    background: #050608;
    border: 1.5px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .adm-role button.on {
    border-color: rgba(124,92,255,0.7);
    background: rgba(124,92,255,0.12);
    color: #fff;
    box-shadow: 0 0 0 1px rgba(124,92,255,0.2);
  }

  .adm-duration {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
  }
  .adm-duration button {
    padding: 10px 8px;
    border-radius: 11px;
    background: #050608;
    border: 1.5px solid rgba(255,255,255,0.07);
    color: rgba(255,255,255,0.5);
    font-size: 12.5px;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.18s ease;
  }
  .adm-duration button.on {
    border-color: rgba(34,197,94,0.7);
    background: rgba(34,197,94,0.12);
    color: #86efac;
    box-shadow: 0 0 0 1px rgba(34,197,94,0.2);
  }
  .adm-duration button[data-days="permanent"] {
    grid-column: span 2;
  }
  .adm-duration button.on[data-days="permanent"] {
    border-color: rgba(34,211,238,0.7);
    background: rgba(34,211,238,0.12);
    color: #67e8f9;
    box-shadow: 0 0 0 1px rgba(34,211,238,0.2);
  }
  .adm-hint {
    margin-top: 8px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 500;
  }
  .adm-hint svg { opacity: 0.6; }

  .adm-submit {
    width: 100%;
    padding: 14px;
    border-radius: 13px;
    background: linear-gradient(135deg, #7c5cff, #4f8cff);
    color: #fff;
    font-size: 14.5px;
    font-weight: 800;
    letter-spacing: 0.02em;
    font-family: inherit;
    border: none;
    cursor: pointer;
    box-shadow: 0 10px 28px rgba(124,92,255,0.4);
    transition: all 0.18s ease;
    margin-top: 6px;
  }
  .adm-submit:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(124,92,255,0.55); }
  .adm-submit:active { transform: translateY(0); }
  .adm-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .adm-list { display: flex; flex-direction: column; gap: 8px; }
  .adm-loading {
    text-align: center;
    padding: 40px 20px;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
  }
  .adm-loading .spinner-big {
    display: inline-block;
    width: 32px;
    height: 32px;
    border: 3px solid rgba(124,92,255,0.2);
    border-top-color: #7c5cff;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .adm-user {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 14px;
    background: #05060a;
    border: 1px solid rgba(255,255,255,0.06);
    transition: all 0.15s ease;
  }
  .adm-user:hover { border-color: rgba(255,255,255,0.12); }
  .adm-user.off,
  .adm-user.expired { opacity: 0.55; }
  .adm-user.expired .adm-avatar {
    background: linear-gradient(135deg, #3a1e1e, #1a0d0d) !important;
    color: #f87171 !important;
    border-color: #3a2020 !important;
  }
  .adm-user.me {
    border-color: rgba(124,92,255,0.5);
    background: rgba(124,92,255,0.06);
  }
  .adm-avatar {
    width: 40px; height: 40px;
    border-radius: 11px;
    background: linear-gradient(135deg, #23262f, #1a1c23);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 15px;
    font-weight: 800;
    color: #7c5cff;
    flex-shrink: 0;
  }
  .adm-user.me .adm-avatar {
    background: linear-gradient(135deg, #7c5cff, #4f8cff);
    color: #fff;
    border-color: transparent;
  }
  .adm-user-info { flex: 1; min-width: 0; }
  .adm-user-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .adm-user-meta {
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    font-variant-numeric: tabular-nums;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .adm-user-meta .dot {
    width: 3px; height: 3px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
  }
  .adm-tag {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .adm-tag.admin { background: rgba(124,92,255,0.2); color: #a78bfa; }
  .adm-tag.user  { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5); }
  .adm-tag.off   { background: rgba(239,68,68,0.15); color: #f87171; }
  .adm-tag.you   { background: rgba(59,130,246,0.18); color: #60a5fa; }

  .adm-exp {
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.04em;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  .adm-exp.perm     { background: rgba(34,211,238,0.14); color: #67e8f9; }
  .adm-exp.safe     { background: rgba(34,197,94,0.14);  color: #4ade80; }
  .adm-exp.warn     { background: rgba(245,158,11,0.14); color: #fbbf24; }
  .adm-exp.danger   { background: rgba(249,115,22,0.14); color: #fb923c; }
  .adm-exp.critical { background: rgba(239,68,68,0.16);  color: #f87171; animation: expBlink 1.4s infinite; }
  .adm-exp.expired  { background: rgba(120,120,120,0.16); color: #9ca3af; }
  @keyframes expBlink {
    0%,100% { opacity: 1; }
    50%     { opacity: 0.55; }
  }

  .adm-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .adm-btn {
    width: 32px; height: 32px;
    border-radius: 9px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.6);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 13px;
    font-family: inherit;
    padding: 0;
  }
  .adm-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .adm-btn.green:hover { background: rgba(34,197,94,0.15); color: #86efac; border-color: rgba(34,197,94,0.4); }
  .adm-btn.danger:hover { background: rgba(239,68,68,0.15); color: #f87171; border-color: rgba(239,68,68,0.35); }
  .adm-btn:disabled { opacity: 0.25; cursor: not-allowed; }

  .adm-toast {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    padding: 12px 20px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    color: #fff;
    background: rgba(30,32,42,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    box-shadow: 0 12px 34px rgba(0,0,0,0.6);
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s ease;
    z-index: 999;
    max-width: 90vw;
    text-align: center;
  }
  .adm-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .adm-toast.ok  { border-color: rgba(34,197,94,0.5); color: #86efac; }
  .adm-toast.err { border-color: rgba(239,68,68,0.5); color: #fca5a5; }

  @media (max-width: 640px) {
    .adm-shell { padding: 18px 16px 50px; }
    .adm-stats { gap: 6px; }
    .adm-stat { padding: 11px 6px; }
    .adm-stat .lbl { font-size: 9px; letter-spacing: 0.1em; }
    .adm-stat .val { font-size: 17px; }
    .adm-user { padding: 12px; gap: 10px; flex-wrap: wrap; }
    .adm-avatar { width: 36px; height: 36px; }
    .adm-actions { gap: 4px; }
    .adm-btn { width: 30px; height: 30px; font-size: 12px; }
    .adm-user-name { font-size: 13px; }
    .adm-user-meta { font-size: 10.5px; }
  }
</style>
</head>

    <!-- ============================================================
       FIREBASE SDK v8 (UMD)
  ============================================================ -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- Auth (Firebase version) -->
  <script src="js/auth.js"></script>
  <script src="js/auth-guard.js"></script>

  <script>
    (function () {
      'use strict';

      var me = Auth.requireAdmin('login.html');
      if (!me) return;

      document.getElementById('admName').textContent = me.username;

      var pendingRole = 'user';
      var pendingDays = 30;
      var toastEl = document.getElementById('toast');
      var toastT = 0;
      var tickInterval = null;
      var isRendering = false;

      /* =========================================
         TOAST
      ========================================= */
      function toast(msg, type) {
        toastEl.textContent = msg;
        toastEl.className = 'adm-toast show ' + (type || '');
        clearTimeout(toastT);
        toastT = setTimeout(function () {
          toastEl.classList.remove('show');
        }, 2600);
      }

      /* =========================================
         HELPERS
      ========================================= */
      function pad(n) { return n < 10 ? '0' + n : '' + n; }

      function fmtDate(ts) {
        try {
          var d = new Date(ts);
          return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
        } catch (_) { return '-'; }
      }

      function fmtExpiry(user) {
        if (Auth.isPermanent(user)) return 'Selamanya';
        if (Auth.isExpired(user)) return 'Expired ' + fmtDate(user.expiresAt);
        return fmtDate(user.expiresAt);
      }

      function expiryBadge(user) {
        var level = Auth.getExpiryLevel(user);
        if (level === 'permanent') {
          return '<span class="adm-exp perm">∞ Permanen</span>';
        }
        if (level === 'expired') {
          return '<span class="adm-exp expired">Expired</span>';
        }
        var ms = Auth.getRemainingMs(user);
        var days = Math.floor(ms / 86400000);
        var hours = Math.floor((ms % 86400000) / 3600000);

        var label;
        if (days >= 1) {
          label = days + ' hari' + (hours > 0 ? ' ' + hours + 'j' : '');
        } else {
          label = hours + ' jam';
        }

        return '<span class="adm-exp ' + level + '">⏱ ' + label + '</span>';
      }

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* =========================================
         RENDER (ASYNC)
      ========================================= */
      async function render() {
        if (isRendering) return;
        isRendering = true;

        var box = document.getElementById('userList');

        // Loading state (hanya saat pertama)
        if (!box.querySelector('.adm-user')) {
          box.innerHTML = '<div class="adm-loading"><div class="spinner-big"></div><div>Memuat data…</div></div>';
        }

        try {
          var list = await Auth.getAllUsers();

          // Stats
          var total   = list.length;
          var active  = list.filter(function (u) { return u.active && !Auth.isExpired(u); }).length;
          var soon    = list.filter(function (u) {
            var lv = Auth.getExpiryLevel(u);
            return lv === 'warn' || lv === 'danger' || lv === 'critical';
          }).length;
          var expired = list.filter(function (u) { return Auth.isExpired(u); }).length;

          document.getElementById('stTotal').textContent   = total;
          document.getElementById('stActive').textContent  = active;
          document.getElementById('stSoon').textContent    = soon;
          document.getElementById('stExpired').textContent = expired;

          // Sorting: admin dulu, aktif dulu, lalu alfabetis
          list.sort(function (a, b) {
            if (a.role !== b.role) return a.role === 'admin' ? -1 : 1;
            var ea = Auth.isExpired(a) ? 1 : 0;
            var eb = Auth.isExpired(b) ? 1 : 0;
            if (ea !== eb) return ea - eb;
            return String(a.username).localeCompare(String(b.username));
          });

          var adminCount = list.filter(function (u) { return u.role === 'admin'; }).length;

          box.innerHTML = '';

          if (!list.length) {
            box.innerHTML = '<div class="adm-loading">Belum ada akun.</div>';
            isRendering = false;
            return;
          }

          list.forEach(function (u) {
            var isMe = String(u.username).toLowerCase() === me.username.toLowerCase();
            var expired = Auth.isExpired(u);

            var cls = 'adm-user';
            if (!u.active || expired) cls += ' off';
            if (expired) cls += ' expired';
            if (isMe) cls += ' me';

            var el = document.createElement('div');
            el.className = cls;

            var tagClass = u.role === 'admin' ? 'admin' : 'user';
            var tagText = u.role === 'admin' ? 'Admin' : 'User';
            var youTag = isMe ? '<span class="adm-tag you">YOU</span>' : '';
            var offTag = !u.active ? '<span class="adm-tag off">Off</span>' : '';

            var expBadge = expiryBadge(u);

            el.innerHTML =
              '<div class="adm-avatar">' + esc(String(u.username).charAt(0).toUpperCase()) + '</div>' +
              '<div class="adm-user-info">' +
                '<div class="adm-user-name">' +
                  esc(u.username) +
                  youTag +
                  ' <span class="adm-tag ' + tagClass + '">' + tagText + '</span>' +
                  offTag +
                '</div>' +
                '<div class="adm-user-meta">' +
                  '<span>Exp: ' + fmtExpiry(u) + '</span>' +
                  '<span class="dot"></span>' +
                  expBadge +
                '</div>' +
              '</div>' +
              '<div class="adm-actions">' +
                '<button class="adm-btn green" data-act="extend" title="Perpanjang Masa Aktif">⏱</button>' +
                '<button class="adm-btn" data-act="pass" title="Reset Password">🔑</button>' +
                '<button class="adm-btn" data-act="toggle" title="' + (u.active ? 'Nonaktifkan' : 'Aktifkan') + '" ' + (isMe ? 'disabled' : '') + '>' + (u.active ? '🚫' : '✔') + '</button>' +
                '<button class="adm-btn danger" data-act="del" title="Hapus" ' +
                  (isMe || (u.role === 'admin' && adminCount <= 1) ? 'disabled' : '') + '>🗑</button>' +
              '</div>';

            /* ---- Tombol Extend ---- */
            el.querySelector('[data-act="extend"]').addEventListener('click', function () {
              openExtendDialog(u);
            });

            /* ---- Reset Password ---- */
            el.querySelector('[data-act="pass"]').addEventListener('click', async function () {
              var np = prompt('Password baru untuk "' + u.username + '":');
              if (np === null) return;
              np = np.trim();
              if (np.length < 4) {
                toast('Password minimal 4 karakter', 'err');
                if (SFX.err) SFX.err();
                return;
              }
              toast('Menyimpan…', '');
              var r = await Auth.updateUser(u.username, { password: np });
              if (r.ok) {
                toast('Password diubah: ' + np, 'ok');
                if (SFX.ok) SFX.ok();
              } else {
                toast('Gagal mengubah password', 'err');
                if (SFX.err) SFX.err();
              }
            });

            /* ---- Toggle Active ---- */
            el.querySelector('[data-act="toggle"]').addEventListener('click', async function () {
              toast('Menyimpan…', '');
              var r = await Auth.updateUser(u.username, { active: !u.active });
              if (r.ok) {
                toast(u.active ? 'Akun dinonaktifkan' : 'Akun diaktifkan', 'ok');
                if (SFX.tap) SFX.tap();
                render();
              } else {
                toast('Gagal mengubah status', 'err');
                if (SFX.err) SFX.err();
              }
            });

            /* ---- Delete ---- */
            el.querySelector('[data-act="del"]').addEventListener('click', async function () {
              if (!confirm('Hapus akun "' + u.username + '"?')) return;
              toast('Menghapus…', '');
              var r = await Auth.deleteUser(u.username);
              if (r.ok) {
                toast('Akun dihapus', 'ok');
                if (SFX.ok) SFX.ok();
                render();
              } else if (r.reason === 'last_admin') {
                toast('Tidak bisa hapus admin terakhir', 'err');
                if (SFX.err) SFX.err();
              } else {
                toast('Gagal menghapus akun', 'err');
                if (SFX.err) SFX.err();
              }
            });

            box.appendChild(el);
          });

        } catch (err) {
          console.error('[Admin] render error:', err);
          box.innerHTML = '<div class="adm-loading">Gagal memuat data.<br>Coba refresh halaman.</div>';
        } finally {
          isRendering = false;
        }
      }

      /* =========================================
         EXTEND DIALOG
      ========================================= */
      async function openExtendDialog(user) {
        var current = Auth.isPermanent(user)
          ? 'Permanen'
          : (Auth.isExpired(user)
              ? 'Expired (' + fmtDate(user.expiresAt) + ')'
              : fmtDate(user.expiresAt));

        var msg =
          'Perpanjang masa aktif untuk "' + user.username + '"\n\n' +
          'Masa aktif sekarang: ' + current + '\n\n' +
          'Pilih durasi perpanjangan:\n' +
          '  1 = +3 hari\n' +
          '  2 = +7 hari\n' +
          '  3 = +14 hari\n' +
          '  4 = +30 hari\n' +
          '  5 = Permanen (∞)\n' +
          '  6 = Reset ke 30 hari dari sekarang\n\n' +
          'Ketik angka (1-6):';

        var input = prompt(msg, '');
        if (input === null) return;

        input = input.trim();

        var choice = parseInt(input, 10);
        var label = '';
        var promise = null;

        if (choice === 1) { promise = Auth.extendUser(user.username, 3);  label = '+3 hari'; }
        else if (choice === 2) { promise = Auth.extendUser(user.username, 7);  label = '+7 hari'; }
        else if (choice === 3) { promise = Auth.extendUser(user.username, 14); label = '+14 hari'; }
        else if (choice === 4) { promise = Auth.extendUser(user.username, 30); label = '+30 hari'; }
        else if (choice === 5) { promise = Auth.extendUser(user.username, 'permanent'); label = 'Permanen'; }
        else if (choice === 6) { promise = Auth.resetExpiry(user.username, 30); label = 'Reset 30 hari'; }
        else {
          toast('Pilihan tidak valid', 'err');
          if (SFX.err) SFX.err();
          return;
        }

        toast('Menyimpan…', '');

        try {
          var result = await promise;
          if (result && result.ok) {
            toast('Masa aktif "' + user.username + '" ' + label, 'ok');
            if (SFX.win) SFX.win();
            else if (SFX.ok) SFX.ok();
            render();
          } else {
            toast('Gagal memperpanjang akun', 'err');
            if (SFX.err) SFX.err();
          }
        } catch (err) {
          console.error('[Admin] extend error:', err);
          toast('Gagal memperpanjang akun', 'err');
          if (SFX.err) SFX.err();
        }
      }

      /* =========================================
         ROLE PICKER
      ========================================= */
      document.getElementById('rolePick').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        document.querySelectorAll('#rolePick button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        pendingRole = b.dataset.role;

        if (pendingRole === 'admin') {
          document.querySelectorAll('#durPick button').forEach(function (btn) {
            btn.classList.remove('on');
            if (btn.dataset.days === 'permanent') btn.classList.add('on');
          });
          pendingDays = 'permanent';
          updateDurHint();
        }
        if (SFX.tap) SFX.tap();
      });

      /* =========================================
         DURATION PICKER
      ========================================= */
      document.getElementById('durPick').addEventListener('click', function (e) {
        var b = e.target.closest('button');
        if (!b) return;
        document.querySelectorAll('#durPick button').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');

        var v = b.dataset.days;
        pendingDays = (v === 'permanent') ? 'permanent' : parseInt(v, 10);
        updateDurHint();

        if (SFX.tap) SFX.tap();
      });

      function updateDurHint() {
        var hintEl = document.getElementById('durHint');
        if (pendingRole === 'admin') {
          hintEl.textContent = 'Akun admin selalu permanent';
          return;
        }
        if (pendingDays === 'permanent') {
          hintEl.textContent = 'Akun tidak akan expired';
        } else {
          hintEl.textContent = 'Akun akan expired dalam ' + pendingDays + ' hari';
        }
      }

      /* =========================================
         GENERATE PASSWORD
      ========================================= */
      document.getElementById('genPass').addEventListener('click', function () {
        var p = Auth.genPassword(10);
        document.getElementById('newPass').value = p;
        if (SFX.pick) SFX.pick();
      });

      /* =========================================
         ADD USER (ASYNC)
      ========================================= */
      document.getElementById('addBtn').addEventListener('click', async function () {
        var btn = this;
        if (btn.disabled) return;

        var u = document.getElementById('newUser').value;
        var p = document.getElementById('newPass').value;

        btn.disabled = true;
        var oldText = btn.textContent;
        btn.textContent = 'Menyimpan…';

        try {
          var r = await Auth.addUser(u, p, pendingRole, pendingDays);

          if (!r.ok) {
            var msg = 'Gagal menambah akun';
            if (r.reason === 'exists') msg = 'Username sudah dipakai';
            else if (r.reason === 'empty') msg = 'Username / password wajib diisi';
            else if (r.reason === 'short_username') msg = 'Username minimal 3 karakter';
            else if (r.reason === 'short_password') msg = 'Password minimal 4 karakter';
            else if (r.reason === 'invalid_username') msg = 'Username hanya huruf, angka, titik, _, -';
            else if (r.reason === 'firebase_error') msg = 'Koneksi ke server gagal';
            toast(msg, 'err');
            if (SFX.err) SFX.err();
            return;
          }

          var durText = (pendingDays === 'permanent') ? 'permanent' : (pendingDays + ' hari');
          toast('Akun "' + u.trim() + '" dibuat (' + durText + ')', 'ok');
          if (SFX.win) SFX.win();

          document.getElementById('newUser').value = '';
          document.getElementById('newPass').value = '';

          render();

        } catch (err) {
          console.error('[Admin] addUser error:', err);
          toast('Gagal menambah akun', 'err');
          if (SFX.err) SFX.err();
        } finally {
          btn.disabled = false;
          btn.textContent = oldText;
        }
      });

      /* =========================================
         LOGOUT
      ========================================= */
      document.getElementById('logoutBtn').addEventListener('click', function () {
        if (!confirm('Logout dari akun ini?')) return;
        Auth.logout();
        if (SFX.tap) SFX.tap();
        window.location.href = 'login.html';
      });

      /* =========================================
         AUTO REFRESH (tiap 60 detik)
      ========================================= */
      tickInterval = setInterval(function () {
        render();
      }, 60000);

      /* =========================================
         INIT
      ========================================= */
      updateDurHint();

      // Tunggu Firebase ready dulu
      function initRender() {
        if (window.firebaseReady) {
          render();
        } else {
          var box = document.getElementById('userList');
          box.innerHTML = '<div class="adm-loading">Koneksi ke server gagal.<br>Coba refresh halaman.</div>';
        }
      }

      if (window.firebaseReady) {
        initRender();
      } else {
        window.addEventListener('firebase-ready', initRender);
        // Fallback: coba lagi setelah 2 detik
        setTimeout(initRender, 2000);
      }
    })();
  </script>

  <!-- ====== PWA: Register Service Worker ====== -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('[PWA] Service Worker registered:', reg.scope))
          .catch(err => console.warn('[PWA] SW registration failed:', err));
      });
    }
  </script>

</body>
